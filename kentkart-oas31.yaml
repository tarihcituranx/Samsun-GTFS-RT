  - name: Hesap
    description: Kimlik doğrulama gerektiren işlemler

  - name: Şehirler
    description: Kentkart kullanan şehirlerin listesi

  - name: Arama
    description: Hat ve durak arama / fihristi

  - name: Bilgi
    description: Tarife ve duyurular

  - name: Hat Bilgileri
    description: Güzergah, araç konumu ve tarife (bit maskesi)

  - name: Canlı Takip
    description: Durağa yaklaşan araçlar ve ETA

  - name: Keşif
    description: Konuma yakın durak, kiosk ve mekân

  - name: Rota Planlama
    description: A→B yol tarifi (OpenTripPlanner)

  - name: Kart (Login Gerekli)
    description: Kimlik doğrulama gerektiren kart işlemleri

  - name: Yapılandırma
    description: Uygulama yapılandırması ve OAuth kimlik bilgileri

# ─────────────────────────────────────────────────────────────
#  MİMARİ NOTLAR
# ─────────────────────────────────────────────────────────────
# x-architecture:
#   service.kentkart.com/rl1 → tek aktif veri sunucusu
#   rl2, rl3 → HTTP 403 (var ama kapalı)
#   auth.kentkart.com/rl1 → OAuth sunucusu
#   /oauth/token → AKTİF (önceki not yanlıştı) — grantType:authorizationCode
#
# x-result-codes:
#   0=başarılı | 33=login gerekli | 34=geçersiz token (tahmin) | 404=endpoint yok
#
# x-field-inconsistencies:
#   plateNumber (pathInfo) ≠ plate (nearest/bus)
#   busStopid (nearest/bus stopInfo, küçük 'i') ≠ stopId (diğerleri)
#   stopName (web/nearest/find) ≠ name (api/search)
#   nearest/place → stopList (NOT busStopList)
#
# x-rate-limit:
#   /oauth/otp → Günlük limit var. Code 1010: "günlük limit aşılmıştır"
#   /web/* → Polling için 10-15 saniye önerilir. Rate limit gözlemlenmedi.
#   /api/* → Rate limit gözlemlenmedi.
#
# x-tested-endpoints (2026-02-28):
#   ✅ /api/v2.0/city → 200 OK, 24 şehir
#   ✅ /web/nearest/find → 200 OK
#   ✅ /web/pathInfo → 200 OK, resultType=011000
#   ✅ /web/nearest/bus → 200 OK, ETA verisi
#   ✅ /web/nearest/stop → 200 OK
#   ✅ /web/nearest/place → 200 OK
#   ✅ /web/tour → 200 OK, 10 rota alternatifi
#   ✅ /api/info/announce → 200 OK
#   ✅ /api/search → 200 OK
#   ✅ /api/route/list → 200 OK, 91 hat
#   ✅ /api/products → 200 OK
#   ✅ /assets/config/appConfig.json → 200 OK
#   ✅ /api/info/tariff → 200 OK, 4 tarife
#
# x-unknowns:
#   resultType[5]='000001' → 200 OK döner ancak boş veri döner
#   OAuth otp/authorize request body tam yapısı bilinmiyor
#   tour.tripList leg detayları bilinmiyor
#
# x-hat-renkleri-ordu:
#   52=FF9918 | 52A=F0FF06 | 52B=B6FF06 | 52C=31BF13 | 52D=FF0000
#   53A=12FF8F | 57=AD23FF | 61=FF224F | 62=F9FF29
#   63=FF979B | 64=A30001 | 67=9B6348
