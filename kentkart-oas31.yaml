    # ── Tour (Rota Planlayıcı) ────────────────────────────────

    TourPlace:
      type: object
      description: >
        Rota planlayıcıda bir nokta (başlangıç, bitiş veya durak).
        `vertexType`: `NORMAL` = serbest nokta, `TRANSIT` = durak.
      properties:
        name:
          type: string
          examples:
            - "Origin"
            - "1013 SOKAK DURAĞI 1"
        lon:
          type: number
          format: double
          examples:
            - 37.90323
        lat:
          type: number
          format: double
          examples:
            - 40.960276
        orig:
          type: string
          examples:
            - ""
        vertexType:
          type: string
          description: "NORMAL = serbest nokta, TRANSIT = toplu taşıma durağı"
          enum: [NORMAL, TRANSIT]
          examples:
            - "NORMAL"
        stopId:
          type: string
          description: "GTFS durak ID'si. Format: `{agencyId}:{stopId}`. Sadece TRANSIT noktalarda."
          examples:
            - "5:10150"
        stopIndex:
          type: integer
          description: Hat güzergahındaki 0-tabanlı durak sırası. Sadece TRANSIT.
          examples:
            - 5
        stopSequence:
          type: integer
          description: GTFS trip içindeki durak sırası (1-tabanlı). Sadece TRANSIT.
          examples:
            - 6
        arrival:
          type: integer
          description: Unix timestamp (ms). Varış zamanı. Sadece `to` nesnesinde.
          examples:
            - 1772193179000
        departure:
          type: integer
          description: Unix timestamp (ms). Kalkış zamanı.
          examples:
            - 1772192454000

    LegGeometry:
      type: object
      description: Bacağın harita üzerindeki güzergahı.
      properties:
        points:
          type: string
          description: >
            ⭐ Google Encoded Polyline formatında sıkıştırılmış koordinat dizisi.
            Decode için: https://developers.google.com/maps/documentation/utilities/polylinealgorithm
          examples:
            - "}`_yF{}ifF?AYg@kAaBiAuA"
        length:
          type: integer
          description: Polyline içindeki nokta sayısı
          examples:
            - 29

    WalkStep:
      type: object
      description: >
        Yürüyüş bacağındaki tek bir yön talimatı.
        Sadece `mode=WALK` olan leg'lerde `steps[]` içinde bulunur.
        `mode=BUS` leg'lerinde `steps` boş array döner.
      properties:
        distance:
          type: number
          format: double
          description: Bu adımın mesafesi (metre)
          examples:
            - 757.23
        relativeDirection:
          type: string
          description: Önceki adıma göre yön
          enum:
            - DEPART
            - CONTINUE
            - SLIGHTLY_LEFT
            - SLIGHTLY_RIGHT
            - LEFT
            - RIGHT
            - HARD_LEFT
            - HARD_RIGHT
            - UTURN_LEFT
            - UTURN_RIGHT
            - CIRCLE_CLOCKWISE
            - CIRCLE_COUNTERCLOCKWISE
          examples:
            - "DEPART"
        streetName:
          type: string
          description: Cadde/sokak adı. `bogusName=true` ise isimsiz yol.
          examples:
            - "Arif Hikmet Onat Cd."
        absoluteDirection:
          type: string
          description: Pusula yönü
          enum: [NORTH, NORTHEAST, EAST, SOUTHEAST, SOUTH, SOUTHWEST, WEST, NORTHWEST]
          examples:
            - "NORTHEAST"
        stayOn:
          type: boolean
          description: Aynı cadde/sokakta devam ediliyor mu
          examples:
            - false
        area:
          type: boolean
          examples:
            - false
        bogusName:
          type: boolean
          description: "`true` ise cadde adı gerçek değil (isimsiz yol)"
          examples:
            - true
        lon:
          type: number
          format: double
          examples:
            - 37.90318874041884
        lat:
          type: number
          format: double
          examples:
            - 40.96031229813711
        elevation:
          type: array
          description: Yükseklik profili (çoğunlukla boş array)
          items:
            type: number
        exit:
          type: string
          description: Döner kavşak çıkış numarası (sadece CIRCLE_* yönlerde)
          examples:
            - "3"

    LegItem:
      type: object
      description: >
        Bir yolculuk bacağı. `transitLeg=false` → yürüyüş (WALK),
        `transitLeg=true` → toplu taşıma (BUS vb.).

        **Alan farklılıkları:**

        | Alan               | WALK leg | BUS leg |
        |--------------------|:--------:|:-------:|
        | route              | `""` (boş) | hat kodu (örn. `"61A"`) |
        | agencyName         | yok      | ✅ |
        | routeColor         | yok      | ✅ |
        | routeShortName     | yok      | ✅ |
        | routeLongName      | yok      | ✅ |
        | tripId / tripShortName | yok  | ✅ |
        | serviceDate        | yok      | ✅ |
        | legFare            | yok      | ✅ (32.5 = ₺32.50) |
        | steps[]            | ✅ dolu  | boş array |
        | headsign           | yok      | ✅ |
      properties:
        startTime:
          type: integer
          description: Bacağın başlangıç zamanı (Unix timestamp ms)
          examples:
            - 1772192454000
        endTime:
          type: integer
          description: Bacağın bitiş zamanı (Unix timestamp ms)
          examples:
            - 1772193179000
        departureDelay:
          type: integer
          description: Kalkış gecikmesi (saniye, gerçek zamanlı)
          examples:
            - 0
        arrivalDelay:
          type: integer
          examples:
            - 0
        realTime:
          type: boolean
          description: Gerçek zamanlı veri mi yoksa tarifeli mi
          examples:
            - false
        distance:
          type: number
          format: double
          description: Bacağın toplam mesafesi (metre)
          examples:
            - 931.495
        pathway:
          type: boolean
          examples:
            - false
        mode:
          type: string
          description: "Ulaşım modu. WALK veya BUS (diğer modlar gözlemlenmedi)"
          enum: [WALK, BUS, RAIL, SUBWAY, TRAM, FERRY, CABLE_CAR, GONDOLA, FUNICULAR]
          examples:
            - "WALK"
        route:
          type: string
          description: "Hat kodu. WALK leg'lerde `\"\"` (boş string)"
          examples:
            - "61A"
        agencyTimeZoneOffset:
          type: integer
          description: Ajans saat dilimi ofseti (ms). TR = 10800000 (UTC+3)
          examples:
            - 10800000
        interlineWithPreviousLeg:
          type: boolean
          examples:
            - false
        from:
          $ref: '#/components/schemas/TourPlace'
        to:
          $ref: '#/components/schemas/TourPlace'
        legGeometry:
          $ref: '#/components/schemas/LegGeometry'
        rentedBike:
          type: boolean
          examples:
            - false
        transitLeg:
          type: boolean
          description: "`true` = toplu taşıma bacağı, `false` = yürüyüş bacağı"
          examples:
            - false
        duration:
          type: integer
          description: Bacağın süresi (saniye)
          examples:
            - 725
        steps:
          type: array
          description: "Yürüyüş yön talimatları. BUS leg'lerde boş array döner."
          items:
            $ref: '#/components/schemas/WalkStep'
        # ── Sadece BUS leg'lerde bulunan alanlar ─────────────
        agencyName:
          type: string
          description: Otobüs işletmeci adı (sadece BUS)
          examples:
            - "Ordu Özel Halk Otobüsleri (Uzun)"
        agencyUrl:
          type: string
          examples:
            - "http://www.kentkart.com"
        agencyId:
          type: string
          examples:
            - "3"
        routeColor:
          type: string
          description: Hat rengi (6 haneli HEX, '#' olmadan). Sadece BUS.
          examples:
            - "FF0000"
        routeTextColor:
          type: string
          description: Yazı rengi (6 haneli HEX). Sadece BUS.
          examples:
            - "FFFFFF"
        routeType:
          type: integer
          description: "GTFS araç tipi. 3=Otobüs. Sadece BUS."
          examples:
            - 3
        routeId:
          type: string
          description: "GTFS rota ID'si. Format: `{agencyId}:{routeCode}`. Sadece BUS."
          examples:
            - "5:00611"
        routeShortName:
          type: string
          description: "Kısa hat adı (Örn. '61A'). Sadece BUS."
          examples:
            - "61A"
        routeLongName:
          type: string
          description: "Uzun hat adı. Sadece BUS."
          examples:
            - "ATASANAYİ-GÖZÜKAN MEVKİİ"
        headsign:
          type: string
          description: Araç levhası. Sadece BUS.
          examples:
            - "OKSM-ORDU LİS.-KEMER KÖPRÜ-EĞİTİM ARAŞ. HAST.-GÖZÜKAN MEVKİİ"
        tripShortName:
          type: string
          description: >
            Sefer kısa adı. Sadece BUS.
            ⚠️ Bazen `#` ile biten veya renk kodu içeren değerler görüldü
            (`"KUYU SAPAĞINDAN KALKAR...#1ab8e0"` gibi — muhtemelen UI amaçlı).
          examples:
            - "OKSM-ORDU LİS.-KEMER KÖPRÜ-EĞİTİM ARAŞ. HAST.-GÖZÜKAN MEVKİİ#"
        tripId:
          type: string
          description: "GTFS trip ID'si. Format: `{agencyId}:{gtfsTripId}`. Sadece BUS."
          examples:
            - "5:86116"
        serviceDate:
          type: string
          description: "Sefer tarihi (YYYYMMDD). Sadece BUS."
          examples:
            - "20260227"
        legFare:
          type: number
          format: double
          description: >
            ⭐ Bu bacağın bilet ücreti (TL). Sadece BUS.
            Transfers=0 yolculuklarda tek ücret, transfers>0'da her bacak için ayrı.
          examples:
            - 32.5

    Itinerary:
      type: object
      description: >
        Tek bir rota alternatifi. `legs` dizisi yolculuğun tüm bacaklarını içerir
        (WALK + BUS + WALK gibi). `totalFare` tüm bacakların ücret toplamıdır.
      properties:
        duration:
          type: integer
          description: Toplam yolculuk süresi (saniye)
          examples:
            - 1445
        startTime:
          type: integer
          description: Yolculuk başlangıç zamanı (Unix timestamp ms)
          examples:
            - 1772192454000
        endTime:
          type: integer
          description: Yolculuk bitiş zamanı (Unix timestamp ms)
          examples:
            - 1772193899000
        walkTime:
          type: integer
          description: Toplam yürüyüş süresi (saniye)
          examples:
            - 963
        transitTime:
          type: integer
          description: Toplam araçta geçen süre (saniye)
          examples:
            - 480
        waitingTime:
          type: integer
          description: Toplam bekleme süresi (saniye)
          examples:
            - 2
        walkDistance:
          type: number
          format: double
          description: Toplam yürüyüş mesafesi (metre)
          examples:
            - 1235.758255634185
        walkLimitExceeded:
          type: boolean
          description: Yürüyüş limiti aşıldı mı
          examples:
            - false
        elevationLost:
          type: number
          examples:
            - 0
        elevationGained:
          type: number
          examples:
            - 0
        transfers:
          type: integer
          description: "⭐ Aktarma sayısı. 0 = aktarmasız, 1 = bir aktarma"
          examples:
            - 0
        legs:
          type: array
          description: Yolculuk bacakları (WALK + BUS + WALK gibi sıralanır)
          items:
            $ref: '#/components/schemas/LegItem'
        tooSloped:
          type: boolean
          examples:
            - false
        totalFare:
          type: number
          format: double
          description: >
            ⭐ Toplam bilet ücreti (TL).
            Aktarmasız = 32.5, tek aktarmalı = 65.0 (her bacak 32.5).
          examples:
            - 32.5

    TourPlan:
      type: object
      description: Rota planlama sonucunun ana bloğu.
      properties:
        date:
          type: integer
          description: Sorgu zamanı (Unix timestamp ms)
          examples:
            - 1772192160000
        from:
          $ref: '#/components/schemas/TourPlace'
        to:
          $ref: '#/components/schemas/TourPlace'
        itineraries:
          type: array
          description: Rota alternatifleri listesi (en fazla `numItineraries` adet)
          items:
            $ref: '#/components/schemas/Itinerary'

    TourRequestParameters:
      type: object
      description: Sunucunun aldığı sorgu parametrelerinin yansıması.
      properties:
        date:
          type: string
          examples:
            - "02-27-2026"
        arriveBy:
          type: string
          enum: ["true", "false"]
          examples:
            - "false"
        fromPlace:
          type: string
          description: "Başlangıç koordinatı. Format: `{lat},{lng}`"
          examples:
            - "40.960276,37.90323"
        toPlace:
          type: string
          description: "Bitiş koordinatı. Format: `{lat},{lng}`"
          examples:
            - "40.985348,37.881527"
        time:
          type: string
          examples:
            - "14:36"
        numItineraries:
          type: string
          description: İstenen maksimum rota alternatifi sayısı
          examples:
            - "10"

    TourDebugOutput:
      type: object
      description: OTP (OpenTripPlanner) motor performans metrikleri.
      properties:
        precalculationTime:
          type: integer
          description: Ön hesaplama süresi (ms)
          examples:
            - 7
        pathCalculationTime:
          type: integer
          examples:
            - 16
        pathTimes:
          type: array
          items:
            type: integer
          examples:
            - [4, 1, 1, 1, 1, 1, 2, 2, 2, 1]
        renderingTime:
          type: integer
          examples:
            - 1
        totalTime:
          type: integer
          description: Toplam işlem süresi (ms)
          examples:
            - 24
        timedOut:
          type: boolean
          examples:
            - false

    TripListObject:
      type: object
      description: >
        `/web/tour` yanıtındaki `tripList` bloğu.

        ⚠️ **`tripList` bir array değil, object'tir.**
        Rota alternatifleri `tripList.plan.itineraries[]` içindedir.
      properties:
        requestParameters:
          $ref: '#/components/schemas/TourRequestParameters'
        plan:
          $ref: '#/components/schemas/TourPlan'
        debugOutput:
          $ref: '#/components/schemas/TourDebugOutput'

    # ── Kart Bakiye ───────────────────────────────────────────

    CardUsageItem:
      type: object
      description: >
        Tek bir biniş veya yükleme işlemi.
        `type=0` = biniş (para çıkışı), `type=1` = yükleme (para girişi).
      properties:
        amt:
          type: string
          description: İşlem tutarı (₺, string float)
          examples:
            - "12.00"
        type:
          type: integer
          description: "0=Biniş (harcama), 1=Yükleme"
          enum: [0, 1]
          examples:
            - 0
        date:
          type: string
          description: İşlem tarihi ve saati (DD/MM/YYYY HH:MM)
          examples:
            - "20/02/2026 15:58"
        unixtime:
          type: integer
          description: İşlem zamanı (Unix timestamp, saniye)
          examples:
            - 1771592309

    CardBalanceItem:
      type: object
      description: >
        `/api/card/balance → cardlist[0]` — kart bakiyesi ve son işlemler.
        Doğrulandı (2026-02-27, Sivas 005, alias={{CARD_ALIAS_FULL}}).
      properties:
        aliasNo:
          type: string
          description: Kart alias numarası (kısa format)
          examples:
            - "{{CARD_ALIAS_SHORT}}"
        balance:
          type: string
          description: "⭐ Güncel bakiye (₺, string float)"
          examples:
            - "16.10"
        cardNo:
          type: string
          description: Tam kart numarası (16 hane)
          examples:
            - "{{CARD_NO_16}}"
        systemId:
          type: string
          description: Karta ait şehir kodu
          examples:
            - "005"
        message:
          type: string
          examples:
            - ""
        expiredDate:
          type: string
          examples:
            - ""
        expiryDate:
          type: string
          examples:
            - ""
        usage:
          type: array
          description: Son biniş ve yükleme işlemleri (en yeni önce)
          items:
            $ref: '#/components/schemas/CardUsageItem'
        expiredStatus:
          type: string
          description: "0=Geçerli, 1=Süresi dolmuş"
          enum: ["0", "1"]
          examples:
            - "0"
        blacklistStatus:
          type: string
          description: "0=Normal, 1=Kara listede"
          enum: ["0", "1"]
          examples:
            - "0"
        product_code:
          type: string
          description: Ürün kodu (`/api/products`'taki `product_code` ile eşleşir)
          examples:
            - "10-1"
        virtualCard:
          type: string
          description: "0=Fiziksel, 1=Sanal"
          enum: ["0", "1"]
          examples:
            - "0"
        userCard:
          type: string
          description: "0=Anonim kart, 1=Kişisel kart"
          enum: ["0", "1"]
          examples:
            - "0"
        isPersonalized:
          type: boolean
          examples:
            - false
        creditCard:
          type: string
          description: "0=Kentkart, 1=Kredi kartı"
          enum: ["0", "1"]
          examples:
            - "0"
        isActive:
          type: string
          description: "1=Aktif"
          enum: ["0", "1"]
          examples:
            - "1"
        isTicket:
          type: string
          examples:
            - "0"
        isWallet:
          type: string
          examples:
            - "0"
        notificationLimit:
          type: string
          description: Bildirim limiti (boş olabilir)
          examples:
            - ""
        cardType:
          type: string
          description: "00=RF kart, 09=NFC"
          examples:
            - "00"

    # ── Hesap ─────────────────────────────────────────────────

    AccountInfo:
      type: object
      description: Giriş yapmış kullanıcının hesap bilgileri (`/api/account → accountInfo`). Doğrulandı 2026-02-27.
      properties:
        user_id:
          type: string
          description: Kentkart kullanıcı ID'si (JWT `sub` ile aynı)
          examples:
            - "{{USER_ID}}"
        accountId:
          type: string
          description: Hesap numarası
          examples:
            - "{{ACCOUNT_ID}}"
        name:
          type: string
          examples:
            - "{{NAME}}"
        surname:
          type: string
          examples:
            - "{{SURNAME}}"
        email:
          type: string
          format: email
          examples:
            - "{{EMAIL}}"
        phone:
          type: string
          description: Telefon numarası (başında 0 olmadan)
          examples:
            - "{{PHONE}}"
        identityNo:
          type: string
          description: TC Kimlik No (boş olabilir)
          examples:
            - ""
        activationStatus:
          type: string
          description: "1=Aktif"
          examples:
            - "1"
        accountCreateDate:
          type: string
          description: Hesap oluşturma tarihi
          examples:
            - "2022-01-08 22:40:48.0"
        cCardNo:
          type: string
          description: Kayıtlı kredi kartı (maskelenmiş)
          examples:
            - "4345 29** **** 5595"
        cCardExprMonth:
          type: string
          examples:
            - ""
        cCardExprYear:
          type: string
          examples:
            - ""
        nfcCardNo:
          type: string
          description: NFC kart numarası (boş olabilir)
          examples:
            - ""
        payment_type:
          type: string
          description: Ödeme tipi
          examples:
            - "1"
        home:
          type: string
          description: Ev adresi/durağı (boş olabilir)
          examples:
            - ""
        work:
          type: string
          description: İş adresi/durağı (boş olabilir)
          examples:
            - ""
        country_code:
          type: string
          examples:
            - "tr"
        file_url:
          type: string
          description: Profil fotoğrafı URL'si (boş olabilir)
          examples:
            - ""
        additional_info:
          type: string
          examples:
            - ""

    # ── Ürünler ───────────────────────────────────────────────

    ProductPrice:
      type: object
      description: Ürün fiyat ve yükleme limitleri
      properties:
        product_price:
          type: string
          description: Ürün satış fiyatı (0=ücretsiz kart)
          examples:
            - "0"
        max_charge_amount:
          type: number
          description: Maksimum tek seferlik yükleme miktarı (₺)
          examples:
            - 500
        min_charge_amount:
          type: number
          description: Minimum yükleme miktarı (₺)
          examples:
            - 50
        card_max_balance:
          type: number
          description: Kartta tutulabilecek maksimum bakiye (₺)
          examples:
            - 2000
        predefined_amount:
          type: array
          description: Önceden tanımlı yükleme miktarları
          items:
            type: object
            properties:
              type:
                type: integer
              amount:
                type: number
        membershipAmount:
          type: string
          description: NFC üyelik ücreti (varsa)
          examples:
            - "4"

    ProductItem:
      type: object
      description: >
        Bir kart/yükleme ürünü (`/api/products → InventoryArray`). Doğrulandı 2026-02-27.
        Ordu (031) için: RF-Card (fiziksel) ve NFC (telefon kartı).
      properties:
        transaction_type:
          type: string
          description: "1=RF kart yükleme, 3=NFC kart"
          examples:
            - "1"
        product_code:
          type: string
          examples:
            - "10-1"
        product_name:
          type: string
          examples:
            - "RF-Card"
        desc:
          type: string
          examples:
            - "RF-Card"
        product_type:
          type: string
          examples:
            - "0"
        originSystemId:
          type: string
          description: Bölge kodu
          examples:
            - "031"
        price:
          $ref: '#/components/schemas/ProductPrice'
        media_type:
          type: string
          description: "00=RF kart, 09=NFC"
          examples:
            - "00"
        passenger_type:
          type: string
          examples:
            - "01"
        process_type:
          type: string
          description: "RT=RF kart, NFC=NFC kart"
          examples:
            - "RT"
        recharge_status:
          type: string
          description: "1=Yükleme yapılabilir"
          examples:
            - "1"
        sale_status:
          type: string
          description: "1=Satışta"
          examples:
            - "0"
        notifyKey:
          type: string
          examples:
            - "RF"
        checkDeposit:
          type: boolean
          examples:
            - false
        ticketSupport:
          type: string
          examples:
            - "0"
        odSupport:
          type: string
          examples:
            - "0"

    # ── OAuth ────────────────────────────────────────────────

    OAuthResultObject:
      type: object
      description: >
        OAuth endpoint'lerinin döndürdüğü `result` bloğu.
        `/web/` ve `/api/` endpoint'lerindeki `ResultObject`'ten farklı yapıdadır.
      properties:
        cmd:
          type: string
          description: İşlem kodu (kısaltılmış, ör. `/oauth/ot`)
          examples:
            - "/oauth/ot"
        code:
          type: ["integer", "string"]
          description: >
            0 veya `"0"` = başarılı.
            401 = eksik/yanlış parametre.
            1083 = telefon formatı hatası.
          examples:
            - 0
        message:
          type: string
          examples:
            - "OK"
        time:
          type: string
          description: ISO 8601 zaman damgası (ResultObject.dateTime'dan farklı format)
          examples:
            - "2026-02-27T12:48:10.484Z"
        extraErrorMessage:
          type: string
          description: Hata durumunda eksik/yanlış alanı açıklar
          examples:
            - "required field empty :countryCode"

# Rate Limiting Bilgisi:
# OTP endpoint'i günlük limit'e sahiptir.
# code: 1010 - "Cep telefonunuza doğrulama kodu daha önce gönderilmiş olup günlük limit aşılmıştır"
# Çözüm: Birkaç saat veya ertesi gün tekrar deneyin.

    OtpRequestBody:
      type: object
      required:
        - clientId
        - loginType
        - phoneNumber
        - countryCode
        - responseType
      description: >
        `/oauth/otp` endpoint'ine gönderilecek JSON body.
        `region`, `authType`, `lang` query parametresi olarak gönderilir (body'de değil).
      properties:
        clientId:
          type: string
          description: "🔑 OAuth client ID - appConfig.json'dan alınır veya kullanıcıdan istenir"
          examples:
            - "rH7S2"
        loginType:
          type: string
          enum: [phone]
          examples:
            - "phone"
        phoneNumber:
          type: string
          description: "📱 Kullanıcı telefon numarası - başında 0 olmadan 10 hane (örn: 5XX1234567)"
          examples:
            - "5XX1234567"
        countryCode:
          type: string
          description: "⚠️ `'+90'` değil, ISO ülke kodu `'tr'` gönderilmeli"
          examples:
            - "tr"
        responseType:
          type: string
          enum: [code]
          examples:
            - "code"

    OtpResponse:
      type: object
      description: >
        `/oauth/otp` başarılı yanıtı. `refNo` ikinci adımda zorunludur.
      properties:
        result:
          $ref: '#/components/schemas/OAuthResultObject'
        refNo:
          type: string
          description: "⭐ SMS referans numarası — `/oauth/authorize` adımında gönderilmesi gerekir"
          examples:
            - "4UHWUGU1SBU"

    AuthorizeRequestBody:
      type: object
      required:
        - clientId
        - loginType
        - phoneNumber
        - countryCode
        - responseType
        - refNo
        - otpCode
      description: >
        `/oauth/authorize` endpoint'ine gönderilecek JSON body.
        `region`, `authType`, `lang` query parametresi olarak gönderilir.
      properties:
        clientId:
          type: string
          description: "🔑 OAuth client ID - appConfig.json'dan alınır veya kullanıcıdan istenir"
          examples:
            - "rH7S2"
        loginType:
          type: string
          enum: [phone]
          examples:
            - "phone"
        phoneNumber:
          type: string
          description: "📱 Kullanıcı telefon numarası - başında 0 olmadan 10 hane (örn: 5XX1234567)"
          examples:
            - "5XX1234567"
        countryCode:
          type: string
          description: "⚠️ `'tr'` (ISO kod) — `'+90'` değil"
          examples:
            - "tr"
        responseType:
          type: string
          enum: [code]
          examples:
            - "code"
        refNo:
          type: string
          description: "⭐ `/oauth/otp` yanıtından gelen referans numarası"
          examples:
            - "4UHWUGU1SBU"
        otpCode:
          type: string
          description: "⭐ Alan adı `otp` değil `otpCode`. SMS ile gelen 6 haneli kod."
          examples:
            - "55106"

    AuthorizeResponse:
      type: object
      description: >
        `/oauth/authorize` başarılı yanıtı. `code` üçüncü adımda (`/oauth/token`) kullanılır.
      properties:
        result:
          $ref: '#/components/schemas/OAuthResultObject'
        code:
          type: string
          description: "⭐ Authorization code — `/oauth/token` adımında `grantType:authorizationCode` ile kullanılır"
          examples:
            - "22ecfe70-8fa2-8cf6-473e-d94f3f240c18"

    TokenRequestBody:
      type: object
      required:
        - clientId
        - clientSecret
        - redirectUri
        - code
        - grantType
      description: >
        `/oauth/token` endpoint'ine gönderilecek JSON body.
        Bu adım `access_token` üretir. `region`, `authType`, `lang` query'de gönderilir.
      properties:
        clientId:
          type: string
          description: "🔑 OAuth client ID - appConfig.json'dan alınır veya kullanıcıdan istenir"
          examples:
            - "rH7S2"
        clientSecret:
          type: string
          description: "🔐 OAuth client secret - appConfig.json'dan alınır veya kullanıcıdan istenir"
          examples:
            - "Om121T12fSv1j66kp9Un5vE9IMkJ3639"
        redirectUri:
          type: string
          examples:
            - "m.kentkart.com"
        code:
          type: string
          description: "⭐ `/oauth/authorize` yanıtından gelen authorization code"
          examples:
            - "22ecfe70-8fa2-8cf6-473e-d94f3f240c18"
        grantType:
          type: string
          description: "Sabit değer: `authorizationCode`"
          enum: [authorizationCode]
          examples:
            - "authorizationCode"

    TokenResponse:
      type: object
      description: >
        `/oauth/token` başarılı yanıtı. Doğrulandı 2026-02-27.

        ⚠️ **Alan adı `accessToken` (camelCase) — `access_token` (snake_case) değil.**

        `accessToken` tüm kart endpoint'lerinde
        `Authorization: Bearer {accessToken}` header'ı olarak kullanılır.

        **JWT payload alanları (RS256, doğrulandı):**
        - `sub` → kullanıcı ID'si (`accountInfo.user_id` ile aynı)
        - `sid` → session ID
        - `aud` → clientId (`rH7S2`)
        - `exp` → ~5 gün sonra (Unix timestamp)
        - `pexp` → ~1 gün sonra (primary expiry)
        - `scopes` → boş array
      properties:
        result:
          $ref: '#/components/schemas/OAuthResultObject'
        accessToken:
          type: string
          description: "⭐ RS256 imzalı JWT Bearer token (camelCase — NOT access_token)"
          examples:
            - "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
        refreshToken:
          type: string
          description: >
            ⭐ Token yenileme anahtarı. Doğrulandı 2026-02-27.
            Format: `{timestamp}-{uuid}`
          examples:
            - "{{TIMESTAMP}}-{{UUID}}"

    # ── AppConfig ─────────────────────────────────────────────

    AppConfig:
      type: object
      description: "`https://m.kentkart.com/assets/config/appConfig.json` yanıtı"
      properties:
        city:
          type: object
          properties:
            pageTitle:
              type: string
            region:
              type: string
              description: Varsayılan şehir kodu
              examples:
                - "028"
            language:
              type: string
            currency:
              type: string
            bundleId:
              type: string
              examples:
                - "kentkart.web.mkentkart"
        mapConfig:
          type: object
          properties:
            map:
              type: string
              examples:
                - "openstreet"
            lat:
              type: number
            lng:
              type: number
        apiServer:
          type: object
          description: API ve OAuth bağlantı bilgileri
          properties:
            url:
              type: string
              examples:
                - "https://service.kentkart.com/rl1/"
            authUrl:
              type: string
              examples:
                - "https://auth.kentkart.com/rl1/"
            lang:
              type: string
            authType:
              type: string
            clientId:
              type: string
              description: "⭐ OAuth client kimliği"
              examples:
                - "rH7S2"
            clientSecret:
              type: string
              description: "⭐ OAuth client sırrı (SPA gereği public)"
              examples:
                - "Om121T12fSv1j66kp9Un5vE9IMkJ3639"
            redirectUri:
              type: string
              examples:
                - "m.kentkart.com"
            loginTypes:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                    examples:
                      - "phone"
                  translateKey:
                    type: string

    AnnounceItem:
      type: object
      description: Sistem duyurusu.
      properties:
        id:
          type: integer
          examples:
            - 2248
        title:
          type: string
          examples:
            - "TUM ALANI"
        description:
          type: string
          examples:
            - "Uzun açıklama metni..."
        valid_from:
          type: string
          description: Geçerlilik başlangıcı (YYYYMMDDHHmmss)
          examples:
            - "20260109163000"
        valid_to:
          type: string
          description: Geçerlilik bitişi (YYYYMMDDHHmmss)
          examples:
            - "20261231083000"
        region:
          type: string
          examples:
            - "031"
        image:
          type: string
          description: Görselin URL'si (boş olabilir)
          examples:
            - ""

  securitySchemes:
    AuthTypeQuery:
      type: apiKey
      in: query
      name: authType
      description: >
        Tüm `/web/` endpoint'lerinde `authType=4` olarak gönderilmelidir.
        Bu parametre Bearer Token değil, istemci tipi belirtir.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        RS256 imzalı JWT Bearer token. `/oauth/token` endpoint'inden alınır.
        Header: `Authorization: Bearer {access_token}`

        **JWT payload alanları (doğrulandı 2026-02-27):**
        - `sub`: kullanıcı ID
        - `sid`: session ID
        - `aud`: clientId (`rH7S2`)
        - `exp`: ~5 gün geçerli
        - `pexp`: ~1 gün primary expiry
        - `scopes`: boş array

# ─────────────────────────────────────────────────────────────
#  ENDPOINT'LER
# ─────────────────────────────────────────────────────────────
paths:

  /api/v2.0/city:
    get:
      operationId: getCityList
      tags: [Şehirler]
      summary: 🌍 Şehir Listesi
      description: >
        Kentkart altyapısını kullanan tüm aktif şehirleri döner.
        `authType` ve `region` parametreleri gerekmez.
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/LangParam'
        - $ref: '#/components/parameters/AuthTypeParam'
      responses:
        '200':
          description: Aktif şehir listesi
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/ResultObject'
                  city:
                    type: array
                    items:
                      $ref: '#/components/schemas/CityItem'
              examples:
                sehir-listesi:
                  summary: 24 aktif şehir (2026-02-27 doğrulandı)
                  externalValue: './examples/city-response.json'

  /web/nearest/find:
    get:
      operationId: searchAndListRoutes
      tags: [Arama]
      summary: 🔍 Arama ve Hat Fihristi
      description: >
        Sistemdeki hatlarda ve duraklar arasında arama yapar.

        - `keyword` **boş** → o bölgedeki **tüm aktif hatlar** döner.
        - `keyword` dolu → eşleşen hatlar, duraklar ve mekânlar döner.
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/RefererHeader'
        - $ref: '#/components/parameters/RegionParam'
        - $ref: '#/components/parameters/LangParam'
        - $ref: '#/components/parameters/AuthTypeParam'
        - name: keyword
          in: query
          description: Arama terimi. Boş bırakılırsa tüm hatlar döner.
          required: false
          schema:
            type: string
            examples:
              - "ÜNİVERSİTE"
      responses:
        '200':
          description: Arama sonuçları
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
