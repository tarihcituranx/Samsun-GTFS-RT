openapi: "3.1.0"
info:
  title: Kentkart Universal API by Turan KAYA (tarihcituranx)
  description: >
    Kentkart altyapısını kullanan şehirler (Ordu, Adana, Kocaeli, Antalya vb.)
    için tersine mühendislikle çıkarılmış, **gerçek yanıtlarla doğrulanmış**
    tam kapsamlı gayriresmi API şeması.

    **Test:** 103 istek — 2026-02-26 tarihinde Ordu (031) ve Sivas (005) bölgeleriyle doğrulandı.
    12 endpoint canlı API ile 2026-02-27 tarihinde tekrar doğrulandı.

    ---

    ## Mimari

    ```
    service.kentkart.com/rl1/   → Veri API'si (tüm /web/ ve /api/ endpoint'leri)
    auth.kentkart.com/rl1/      → OAuth kimlik doğrulama sunucusu (ayrı subdomain)
    ```

    - `rl2`, `rl3` path'leri var ama HTTP 403 döner (internal/yük dengeleme)
    - `/api/` prefix'i `/web/`'in eski sürümü **değildir**; paralel endpoint seti
    - `version` parametresi sunucu tarafında loglama içindir, yanıtı etkilemez

    ---

    ## Kimlik Doğrulama

    Tüm `/web/` endpoint'leri `authType=4` query parametresi ve aşağıdaki
    HTTP başlıklarını gerektirir. Bearer Token veya kullanıcı girişi **gerekmez**.

    ```
    Origin:       https://m.kentkart.com
    Referer:      https://m.kentkart.com/
    Content-Type: application/json
    Accept:       application/json, text/plain, */*
    ```

    `/api/info/`, `/api/search/`, `/api/route/` endpoint'leri `authType` **olmadan** da çalışır.
    `/api/v2.0/city` endpoint'i hiçbir auth parametresi gerektirmez.

    Kişisel kart ve hesap endpoint'leri için `auth.kentkart.com` üzerinden
    OAuth akışı gerekir (bkz. `/oauth/otp`, `/oauth/authorize`).

    ---

    ## Bölge Kodları (region)

    Kaynak: `/api/v2.0/city` — 2026-02-27 tarihinde doğrulandı (24 aktif şehir).

    | Kod | Şehir       | Lat       | Lon       | NFC | Trip | Online Şarj |
    |-----|-------------|-----------|-----------|:---:|:----:|:-----------:|
    | 003 | Adana       | 37.000805 | 35.313063 | —   | —    | ✅          |
    | 004 | Kocaeli     | 40.759190 | 29.943218 | —   | ✅   | ✅          |
    | 005 | Sivas       | 39.750984 | 37.017016 | —   | —    | ✅          |
    | 007 | Çanakkale   | 40.146601 | 26.408558 | —   | ✅   | ✅          |
    | 010 | Muğla       | 37.219427 | 28.365798 | ✅  | ✅   | ✅          |
    | 011 | Yozgat      | 39.818081 | 34.814689 | —   | ✅   | ✅          |
    | 013 | Edirne      | 41.674963 | 26.560650 | —   | —    | ✅          |
    | 017 | Burdur      | 37.726075 | 30.288427 | —   | —    | ✅          |
    | 019 | Alanya      | 36.558601 | 32.010126 | —   | —    | ✅          |
    | 020 | Ereğli      | 41.292641 | 31.410942 | —   | —    | ✅          |
    | 023 | Niğde       | 37.968180 | 34.686030 | ✅  | —    | ✅          |
    | 024 | Lüleburgaz  | 40.83889  | 31.16389  | —   | ✅   | ✅          |
    | 025 | Kastamonu   | 41.40258  | 33.788334 | —   | ✅   | ✅          |
    | 026 | Antalya     | 36.912500 | 30.689722 | ✅  | ✅   | ✅          |
    | 027 | Kırklareli  | 41.730428 | 27.216754 | —   | ✅   | ✅          |
    | 028 | Gaziantep   | —         | —         | ✅  | —    | ✅          |
    | 029 | Alaplı      | 41.181523 | 31.385391 | —   | —    | ✅          |
    | 031 | Ordu        | 40.983962 | 37.875054 | ✅  | —    | ✅          |
    | 032 | Mardin      | 37.312900 | 40.734000 | —   | —    | ✅          |
    | 033 | Osmaniye    | 37.074600 | 36.246400 | —   | —    | ✅          |
    | 036 | Düzce       | 40.83889  | 31.16389  | —   | ✅   | ✅          |
    | 037 | Safranbolu  | 41.249481 | 32.683709 | —   | —    | ✅          |
    | 038 | Erzurum     | 39.915030 | 41.227120 | —   | ✅   | ✅          |
    | 039 | Tokat       | 40.333809 | 36.552039 | —   | ✅   | ✅          |

    **NFC**: Kart okutma desteği | **Trip**: Rota planlayıcı (`/web/tour`) aktif |
    **Online Şarj**: Kart bakiyesi online yükleme (`oCharge=1`)

    ---

    ## Genel Sonuç Nesnesi

    Her yanıtta `result` bloğu bulunur. `result.code = 0` başarıyı ifade eder.

    | code | Anlam                                          |
    |------|------------------------------------------------|
    | 0    | Başarılı                                       |
    | 33   | Giriş yapılması gerekiyor                      |
    | 34   | Geçersiz/süresi dolmuş token (tahmin)          |
    | 404  | Endpoint bulunamadı                            |

    ---

    ## pathInfo Bit Maskesi (resultType)

    ```
    Karakter: [0]       [1]     [2]         [3]            [4]          [5]
    Alan:     pointList busList busStopList timeTableList  scheduleList ???
    ```

    | resultType | Dönen veri                   |
    |------------|------------------------------|
    | `010000`   | Canlı araçlar (polling)      |
    | `001000`   | Güzergah durakları           |
    | `011000`   | Araçlar + Duraklar ⭐ standart|
    | `100000`   | Polyline koordinatları       |
    | `111000`   | Polyline + Araçlar + Duraklar|
    | `000100`   | Bugünün sefer tarifesi       |
    | `000010`   | Haftalık tarife              |
    | `111110`   | Tüm veriler (ilk açılış)     |
    | `000001`   | Bilinmiyor — boş döner       |

  version: "2.0.0"
  contact:
    name: Turan KAYA (tarihcituranx) — Gayriresmi şema
    url: https://github.com/tarihcituranx
  license:
    name: Tersine mühendislik — gayriresmi, ticari kullanım için uygun değildir

$self: https://example.com/kentkart-openapi.yaml

servers:
  - url: https://service.kentkart.com/rl1
    name: service
    description: Ana veri API sunucusu (tüm /web/ ve /api/ endpoint'leri)
  - url: https://auth.kentkart.com/rl1
    name: auth
    description: OAuth kimlik doğrulama sunucusu (/oauth/ endpoint'leri)

# ─────────────────────────────────────────────────────────────
#  ORTAK BİLEŞENLER
# ─────────────────────────────────────────────────────────────
components:

  parameters:

    OriginHeader:
      name: Origin
      in: header
      required: true
      description: >
        ⚠️ **ZORUNLU - TEST EDİLDİ.** Bu header olmadan tüm `/web/` istekleri
        reddedilir (HTTP 403/400). Sabit değer: `https://m.kentkart.com`

        **Test Sonucu (2026-02-28):** Eksik Origin header → istek başarısız
        **Geçerli Değer:** `https://m.kentkart.com` (slash olmadan)
      schema:
        type: string
        enum:
          - "https://m.kentkart.com"
        examples:
          - "https://m.kentkart.com"

    RefererHeader:
      name: Referer
      in: header
      required: true
      description: >
        ⚠️ **ZORUNLU - TEST EDİLDİ.** Tüm `/web/` endpoint'leri için bu header
        olmadan istek başarısız olur. Origin header ile birlikte gönderilmelidir.
        Sabit değer: `https://m.kentkart.com/`

        **Test Sonucu (2026-02-28):** Eksik header → HTTP 403/400
      schema:
        type: string
        enum:
          - "https://m.kentkart.com/"
        examples:
          - "https://m.kentkart.com/"

    RegionParam:
      name: region
      in: query
      description: >
        Şehir/Bölge kodu. Tüm aktif kodlar için `/api/v2.0/city` endpoint'ini kullanın.

        Bilinen kodlar (2026-02-27, 24 şehir):
        `003`=Adana, `004`=Kocaeli, `005`=Sivas, `007`=Çanakkale, `010`=Muğla,
        `011`=Yozgat, `013`=Edirne, `017`=Burdur, `019`=Alanya, `020`=Ereğli,
        `023`=Niğde, `024`=Lüleburgaz, `025`=Kastamonu, `026`=Antalya, `027`=Kırklareli,
        `028`=Gaziantep, `029`=Alaplı, `031`=Ordu, `032`=Mardin, `033`=Osmaniye,
        `036`=Düzce, `037`=Safranbolu, `038`=Erzurum, `039`=Tokat
      required: true
      schema:
        type: string
        examples:
          - "031"

    LangParam:
      name: lang
      in: query
      description: Dil kodu
      required: true
      schema:
        type: string
        enum: [tr, en]
        default: tr

    AuthTypeParam:
      name: authType
      in: query
      description: >
        İstemci tipi doğrulama kodu. `/web/` endpoint'leri için ZORUNLUDUR.
        Sabit değer `4` olmalıdır.

        **Test Sonucu (2026-02-28):** Eksik authType → HTTP 403/400
        **Geçerli Değer:** `4`
      required: true
      schema:
        type: string
        default: "4"
        enum: ["4"]

    AccuracyParam:
      name: accuracy
      in: query
      description: >
        GPS hassasiyet modu. `0` = standart, `1` = yüksek hassasiyet.
        Test sonuçlarına göre iki değer arasında çıktı farkı gözlemlenmedi;
        parametre opsiyoneldir.
      required: false
      schema:
        type: string
        enum: ["0", "1"]
        default: "0"

    VersionParam:
      name: version
      in: query
      description: >
        İstemci uygulama versiyonu. **Tamamen opsiyoneldir** — sunucu tarafında
        loglama/analytics amaçlıdır, yanıt içeriğini etkilemez.

        Gözlemlenen format: `Web_{appVer}_{sdkVer}_{platform}_{appId}`
      required: false
      schema:
        type: string
        examples:
          - "Web_1.9.6_1.0_ANDROID_kentkart.web.mkentkart"

  schemas:

    ResultObject:
      type: object
      description: Her yanıtta dönen standart sonuç bloğu.
      properties:
        cmd:
          type: string
          description: İstek yapılan endpoint yolu
          examples:
            - "/web/pathInfo"
        code:
          type: integer
          description: >
            0=başarılı, 33=login gerekli,
            34=geçersiz/süresi dolmuş token (tahmin),
            404=endpoint bulunamadı
          examples:
            - 0
        message:
          type: string
          examples:
            - "OK"
        dateTime:
          type: string
          description: Sunucu zaman damgası (YYYYMMDDHHmmss)
          examples:
            - "20260226194500"
        debugTimeDiff:
          type: string
          examples:
            - ""
        authType:
          type: string
          examples:
            - ""

    CityItem:
      type: object
      description: Kentkart altyapısını kullanan bir şehrin tam bilgisi (`/api/v2.0/city`).
      properties:
        id:
          type: string
          description: Bölge/şehir kodu (`region` ile aynı değer)
          examples:
            - "031"
        name:
          type: string
          examples:
            - "Ordu"
        lat:
          type: string
          description: Şehir merkezi enlemi (WGS84, string float)
          examples:
            - "40.98"
        lon:
          type: string
          description: "⚠️ `lon` (NOT `lng`) — Şehir merkezi boylamı (WGS84, string float)"
          examples:
            - "37.88"
        initialRegion:
          type: object
          description: Harita başlangıç görünümü koordinatları
          properties:
            lat:
              type: string
              examples:
                - "40.98"
            lng:
              type: string
              examples:
                - "37.88"
        radius:
          type: string
          description: Şehir yarıçapı (km, string integer)
          examples:
            - "10"
        timezone:
          type: string
          description: IANA zaman dilimi
          examples:
            - "Europe/Moscow"
        visible:
          type: integer
          description: "1=Görünür, 0=Gizli"
          examples:
            - 1
        mCharge:
          type: string
          description: Mobil şarj desteği (tam anlamı belirsiz)
          examples:
            - "3"
        supportEmail:
          type: string
          examples:
            - "mobile@kentkart.com.tr"
        paymentTypes:
          type: object
          description: Desteklenen ödeme yöntemleri
          properties:
            creditCard:
              type: boolean
            bkmExpress:
              type: boolean
            masterPass:
              type: boolean
            sadad:
              type: boolean
        order:
          type: integer
          description: Listede sıralama önceliği
          examples:
            - 50
        panic:
          type: string
          description: Panik butonu desteği (0=yok)
          examples:
            - "0"
        trip:
          type: string
          description: Trip planlama desteği (0=yok, 1=var)
          examples:
            - "0"
        nfc:
          type: string
          description: NFC ile ödeme desteği (0=yok, 1=var)
          examples:
            - "0"
        oCharge:
          type: string
          description: Online şarj desteği (0=yok, 1=var)
          examples:
            - "1"

    RouteItem:
      type: object
      description: >
        Bir otobüs hattının özet bilgisi.
        `/web/nearest/find` ve `/api/search` `routeList` içinde kullanılır.
      properties:
        routeCode:
          type: string
          description: >
            Dahili hat kodu kalıbı: `00{hatNo*100 + direction}`.
            Örn. Hat 52 gidiş=`00520`, Hat 52A=`00521`.
          examples:
            - "00520"
        displayRouteCode:
          type: string
          examples:
            - "52"
        name:
          type: string
          examples:
            - "ÜNİVERSİTE-MERKEZ"
        headSign:
          type: string
          description: Hat levhası (nearest/find'da mevcut, route/list'te yok)
          examples:
            - "ÜNİVERSİTE-MERKEZ"
        routeColor:
          type: string
          description: Hat rengi (6 haneli HEX, '#' olmadan). nearest/find'da var, route/list'te yok.
          examples:
            - "FF9918"
        routeTextColor:
          type: string
          examples:
            - "FFFFFF"
        routeType:
          type: string
          description: "GTFS araç tipi. 3=Otobüs"
          examples:
            - "3"
        direction:
          type: string
          description: "Yön — 0=Gidiş, 1=Dönüş. nearest/find'da var."
          enum: ["0", "1"]
          examples:
            - "0"
        agencyId:
          type: string
          description: İşletmeci ID'si
          examples:
            - "2"
        agencyName:
          type: string
          description: İşletmeci adı
          examples:
            - "Ordu Özel Halk Otobüsleri"

    StopItem:
      type: object
      description: >
        Durak özeti. `/web/nearest/find` ve `/web/nearest/place` `stopList` içinde kullanılır.
        ⚠️ Alan adı `name` (NOT `stopName`) — `/api/search` ile aynı şema.
      properties:
        stopId:
          type: string
          examples:
            - "10514"
        name:
          type: string
          description: "⚠️ Alan adı `name` (NOT `stopName`)"
          examples:
            - "ORDU ÜNİVERSİTESİ DURAĞI 2"
        lat:
          type: string
          examples:
            - "40.976826"
        lng:
          type: string
          examples:
            - "37.970486"
        routeType:
          type: string
          description: "GTFS araç tipi. 3=Otobüs"
          examples:
            - "3"

    PathItem:
      type: object
      description: >
        `/web/pathInfo` yanıtındaki `pathList[0]` nesnesi.

        ⚠️ **Kritik**: `busList`, `busStopList`, `timeTableList`, `scheduleList`
        üst seviyede değil — hepsi `pathList[0]` içinde gömülü gelir.
        Yanıt yapısı: `{ pathList: [{ ...meta, busList: [], busStopList: [], ... }] }`
      properties:
        headSign:
          type: string
          examples:
            - "ÜNİVERSİTE-MERKEZ"
        displayRouteCode:
          type: string
          examples:
            - "52"
        direction:
          type: string
          enum: ["0", "1"]
          examples:
            - "0"
        tripShortName:
          type: string
          examples:
            - "ÜNİVERSİTE-MERKEZ"
        direction_name:
          type: string
          examples:
            - ""
        path_code:
          type: string
          description: >
            Güzergah kodu. Kalıp: `00{hatNo}direction`.
            Hat 52 gidiş → `005200`, Hat 52 dönüş → `005201`.
          examples:
            - "005200"
        pointList:
          type: array
          description: Polyline koordinatları (`resultType[0]='1'` gerektirir)
          items:
            $ref: '#/components/schemas/PointItem'
        busList:
          type: array
          description: Canlı araç konumları (`resultType[1]='1'` gerektirir)
          items:
            $ref: '#/components/schemas/BusItemPathInfo'
        busStopList:
          type: array
          description: Güzergah durakları (`resultType[2]='1'` gerektirir)
          items:
            $ref: '#/components/schemas/BusStopItemPathInfo'
        timeTableList:
          type: array
          description: Bugünün sefer tarifesi (`resultType[3]='1'` gerektirir)
          items:
            $ref: '#/components/schemas/TimeTableItem'
        stopTimeList:
          type: array
          description: Durak bazlı sefer saatleri (tam yapı bilinmiyor)
          items:
            type: object
        scheduleList:
          type: array
          description: Haftalık tarife grupları (`resultType[4]='1'` gerektirir)
          items:
            $ref: '#/components/schemas/ScheduleListItem'

    PointItem:
      type: object
      description: Hat güzergahını çizen polyline koordinat noktası (`resultType[0]='1'`).
      properties:
        seq:
          type: string
          description: Sıra numarası (1'den başlar, string integer)
          examples:
            - "1"
        lat:
          type: string
          examples:
            - "40.977155"
        lng:
          type: string
          examples:
            - "37.97373"

    BusItemPathInfo:
      type: object
      description: >
        Canlı araç verisi — **pathInfo endpoint'inden** (`resultType[1]='1'`).
        ⚠️ Plaka alanı burada `plateNumber`'dır (nearest/bus'tan farklı).
      properties:
        busId:
          type: string
          examples:
            - "52175"
        lat:
          type: string
          examples:
            - "40.985516"
        lng:
          type: string
          examples:
            - "37.87845"
        plateNumber:
          type: string
          description: "⚠️ pathInfo'da `plateNumber` (nearest/bus'ta `plate`)"
          examples:
            - "52 J 0175"
        stopId:
          type: string
          examples:
            - "10172"
        bearing:
          type: string
          description: "Yön açısı 0–360°"
          examples:
            - "215.52"
        vehicleType:
          type: string
          examples:
            - "3"
        tripId:
          type: string
          description: "Sefer ID formatı: `{gtfsTripId}-{serviceId}` (tahmin)"
          examples:
            - "0-0"
        busLabel:
          type: string
          examples:
            - "ÜNİVERSİTE-MERKEZ"
        timeDiff:
          type: string
          examples:
            - ""
        ac:
          type: string
          description: "0=Klimasız, 1=Klimali"
          enum: ["0", "1"]
          examples:
            - "0"
        bike:
          type: string
          enum: ["0", "1"]
          examples:
            - "0"
        disabledPerson:
          type: string
          enum: ["0", "1"]
          examples:
            - "1"
        pickMeUp:
          type: string
          enum: ["0", "1"]
          examples:
            - "1"
        couple:
          type: string
          description: Körüklü araç durumu (boş = körüklü değil)
          examples:
            - ""

    BusItemNearestBus:
      type: object
      description: >
        Canlı araç verisi — **nearest/bus endpoint'inden**.
        ⚠️ Plaka alanı burada `plate`'dir (pathInfo'dan farklı).
      properties:
        busId:
          type: string
          examples:
            - "52201"
        plate:
          type: string
          description: "⚠️ nearest/bus'ta `plate` (pathInfo'da `plateNumber`)"
          examples:
            - "52 J 0074"
        displayRouteCode:
          type: string
          examples:
            - "52A"
        displayName:
          type: string
          examples:
            - "DEVLET HAST.-YENİ MAHALLE-ADLİYE-ÜNİVERSİTE"
        headSign:
          type: string
          examples:
            - "DEVLET HAST.-YENİ MAHALLE-ADLİYE-ÜNİVERSİTE"
        routeCode:
          type: string
          examples:
            - "00521"
        shapeId:
          type: string
          examples:
            - "005211"
        direction:
          type: string
          enum: ["0", "1"]
          examples:
            - "1"
        stopDiff:
          type: string
          description: "⭐ Araç kaç durak uzakta (string integer)"
          examples:
            - "1"
        timeDiff:
          type: string
          description: "⭐ Tahmini geliş dakikası (string integer)"
          examples:
            - "1"
        lat:
          type: string
          examples:
            - "40.97419"
        lng:
          type: string
          examples:
            - "37.97402"
        bearing:
          type: string
          examples:
            - ""
        vehicleType:
          type: string
          examples:
            - "3"
        routeColor:
          type: string
          examples:
            - "F0FF06"
        routeType:
          type: string
          examples:
            - "3"
        routeTextColor:
          type: string
          examples:
            - "FFFFFF"
        ac:
          type: string
          enum: ["0", "1"]
          examples:
            - "0"
        bike:
          type: string
          enum: ["0", "1"]
          examples:
            - "0"
        disabledPerson:
          type: string
          enum: ["0", "1"]
          examples:
            - "1"
        couple:
          type: string
          examples:
            - ""
        dropoffType:
          type: string
          examples:
            - ""
        pickupType:
          type: string
          examples:
            - ""

    BusStopItemPathInfo:
      type: object
      description: Güzergah durağı — **pathInfo** `busStopList` içinden (`resultType[2]='1'`).
      properties:
        seq:
          type: string
          description: Güzergahtaki sıra numarası (1'den başlar)
          examples:
