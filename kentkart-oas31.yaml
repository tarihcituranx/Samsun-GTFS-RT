    ScheduleListItem:
      type: object
      description: >
        Haftalık tarife grubu (`resultType[4]='1'`).

        **`description` alanı (MTWTFss) çözümü:**
        ```
        [0]=Pzt [1]=Sal [2]=Çar [3]=Per [4]=Cum [5]=Cmt [6]=Paz
        Büyük harf = o gün bu tarife geçerlidir.
        "MTWTFss" → Hafta içi
        "mtwtfSs" → Cumartesi
        "mtwtfsS" → Pazar
        ```
      properties:
        description:
          type: string
          description: "⭐ Gün kodu — 7 karakterlik MTWTFss formatı."
          examples:
            - "MTWTFss"
        serviceId:
          type: string
          description: "0=Hafta içi, 1=Cumartesi, 2=Pazar"
          enum: ["0", "1", "2"]
          examples:
            - "0"
        timeList:
          type: array
          items:
