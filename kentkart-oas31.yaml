  /web/tour:
    get:
      operationId: planJourney
      tags: [Rota Planlama]
      summary: 🗺️ Rota Planlayıcı (Journey Planner)
      description: >
        OpenTripPlanner tabanlı toplu taşıma yol tarifi motoru.
        A→B koordinatları arasında yürüyüş + otobüs bacaklarından oluşan
        çoklu rota alternatifleri döner.

        **Yanıt yapısı (gerçek yanıtla doğrulandı):**

        ```
        result          → standart sonuç bloğu
        tripList        → object (⚠️ array değil)
          requestParameters → sunucunun aldığı parametre yansıması
          plan
            from / to   → başlangıç / bitiş noktası
            itineraries[] → rota alternatifleri
              legs[]    → bacaklar: WALK → BUS → WALK
                legGeometry.points → Google Encoded Polyline
                legFare   → bacak bilet ücreti (TL, sadece BUS)
                steps[]   → yürüyüş talimatları (sadece WALK)
          debugOutput   → OTP motor performans metrikleri
        ```

        **Ücret mantığı (Ordu 031 test):**
        - Aktarmasız: `totalFare=32.5` (tek bilet)
        - Tek aktarmalı: `totalFare=65.0` (2 × 32.5)

        **`version` parametresi:** Opsiyonel. Yanıtı etkilemez.

        **`authType` parametresi:** Opsiyonel. Olmadan da çalışır.
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/RefererHeader'
        - $ref: '#/components/parameters/RegionParam'
        - $ref: '#/components/parameters/LangParam'
        - $ref: '#/components/parameters/AuthTypeParam'
        - $ref: '#/components/parameters/VersionParam'
        - name: arriveBy
          in: query
          required: true
          description: >
            `false` = Belirtilen saatte yola çık (en erken hareket).
            `true`  = Belirtilen saatte hedefe var (en geç hareket).
          schema:
            type: string
            enum: ["true", "false"]
            default: "false"
        - name: date
          in: query
          required: true
          description: Yolculuk tarihi — **MM-DD-YYYY** formatı
          schema:
            type: string
            pattern: '^\d{2}-\d{2}-\d{4}$'
            examples:
              - "02-27-2026"
        - name: time
          in: query
          required: true
          description: Yolculuk saati — **HH:MM** formatı (24 saat)
          schema:
            type: string
            pattern: '^\d{2}:\d{2}$'
            examples:
              - "14:36"
        - name: latStart
          in: query
          required: true
          description: Başlangıç noktası enlemi (WGS84 ondalık derece)
          schema:
            type: string
            examples:
              - "40.960276"
        - name: lngStart
          in: query
          required: true
          description: Başlangıç noktası boylamı (WGS84 ondalık derece)
          schema:
            type: string
            examples:
              - "37.90323"
        - name: latEnd
          in: query
          required: true
          description: Hedef noktası enlemi (WGS84 ondalık derece)
          schema:
            type: string
            examples:
              - "40.985348"
        - name: lngEnd
          in: query
          required: true
          description: Hedef noktası boylamı (WGS84 ondalık derece)
          schema:
            type: string
            examples:
              - "37.881527"
      responses:
        '200':
          description: Rota alternatifleri
          content:
            application/json:
              schema:
                type: object
                required: [result, tripList]
                properties:
                  result:
                    $ref: '#/components/schemas/ResultObject'
                  tripList:
                    $ref: '#/components/schemas/TripListObject'
              examples:
                rota-planlama:
                  summary: A→B toplu taşıma rotası (yürüyüş + otobüs)
                  externalValue: './examples/tour-response.json'

