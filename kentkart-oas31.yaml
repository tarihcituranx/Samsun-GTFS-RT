  /oauth/otp:
    post:
      operationId: requestOtp
      servers:
        - url: https://auth.kentkart.com/rl1
          name: auth
          description: OAuth kimlik doğrulama sunucusu
      tags: [Kart (Login Gerekli)]
      summary: 📱 OTP İste — SMS ile telefon doğrulama
      description: >
        OAuth akışının **1. adımı**. Kullanıcının telefon numarasına SMS ile
        tek kullanımlık doğrulama kodu gönderir.

        **Tam 3 adımlı akış (main.js'den doğrulandı):**
        ```
        1. POST /oauth/otp
              → yanıt: { result.code=0, refNo: "4UHWUGU1SBU" }

        2. POST /oauth/authorize  (refNo + otpCode ile)
              → yanıt: { result.code=0, code: "22ecfe70-..." }

        3. POST /oauth/token  (authorization code ile)
              → yanıt: { accessToken: "eyJ...", refreshToken: "timestamp-uuid" }

        4. GET  service.kentkart.com/rl1/api/* endpoint'leri
              Header: Authorization: Bearer {accessToken}
        ```

        **⚠️ Önemli farklar:**
        - `countryCode`: `"+90"` değil `"tr"` gönderilmeli
        - `phoneNumber`: başında 0 olmadan, 10 hane
        - Alan adı `otp` değil `otpCode` (authorize adımında)

        **Bilinen hata kodları:**
        - `1083` → Telefon numarası formatı yanlış (başında 0 olmamalı)
        - `401`  → Eksik/yanlış parametre (`extraErrorMessage` alanına bak)

        **`clientId` ve `clientSecret`:** `https://m.kentkart.com/assets/config/appConfig.json`
        adresinden alınır. Şu an bilinen değerler:
        `clientId=rH7S2`, `clientSecret=Om121T12fSv1j66kp9Un5vE9IMkJ3639`

        **`region`, `authType`, `lang` query parametresi olarak gönderilir — body'de değil.**
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/RegionParam'
        - $ref: '#/components/parameters/AuthTypeParam'
        - $ref: '#/components/parameters/LangParam'
        - $ref: '#/components/parameters/VersionParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequestBody'
            examples:
              phone_tr:
                summary: Türkiye telefon numarası ile (kullanıcıdan telefon numarası istenir)
                value:
                  clientId: "rH7S2"
                  loginType: "phone"
                  responseType: "code"
                  countryCode: "tr"
                  phoneNumber: "5XX1234567"
      responses:
        '200':
          description: >
            SMS gönderildi (code=0) veya hata.
            `refNo` alanı bir sonraki adımda (`/oauth/authorize`) zorunludur.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpResponse'
              examples:
                otp-success:
                  summary: SMS gönderildi (kullanıcıdan SMS kodu bekleniyor)
                  value:
                    result:
                      cmd: "/oauth/ot"
                      code: 0
                      message: "OK"
                      time: "2026-02-27T12:48:10.484Z"
                    refNo: "4UHWUGU1SBU"
                otp-error:
                  summary: Telefon numarası hatası
                  value:
                    result:
                      cmd: "/oauth/ot"
                      code: 1083
                      message: "Error"
                      time: "2026-02-27T12:48:10.484Z"
                      extraErrorMessage: "required field empty :countryCode"
                    refNo: null

  /oauth/authorize:
    post:
      operationId: authorizeWithOtp
      servers:
        - url: https://auth.kentkart.com/rl1
          name: auth
          description: OAuth kimlik doğrulama sunucusu
      tags: [Kart (Login Gerekli)]
      summary: 🔑 OTP Doğrula — Authorization Code Al
      description: >
        OAuth akışının **2. adımı**. `/oauth/otp`'den gelen `refNo` ve
        SMS kodunu (`otpCode`) doğrular, başarılıysa `code` (authorization code) döner.

        **⚠️ Alan adı farkları (gerçek istekten doğrulandı):**
        - `otpCode` (NOT `otp`)
        - `refNo` — `/oauth/otp` yanıtından gelen referans numarası
        - `countryCode`: `"tr"` (NOT `"+90"`)
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/RegionParam'
        - $ref: '#/components/parameters/AuthTypeParam'
        - $ref: '#/components/parameters/LangParam'
        - $ref: '#/components/parameters/VersionParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizeRequestBody'
            examples:
              phone_tr:
                summary: Telefon + OTP ile doğrulama (kullanıcıdan telefon ve SMS kodu istenir)
                value:
                  clientId: "rH7S2"
                  loginType: "phone"
                  responseType: "code"
                  countryCode: "tr"
                  phoneNumber: "5XX1234567"
                  refNo: "4UHWUGU1SBU"
                  otpCode: "123456"
      responses:
        '200':
          description: Authorization code veya hata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizeResponse'
              examples:
                authorize-success:
                  summary: OTP doğrulandı, authorization code oluşturuldu
                  value:
                    result:
                      cmd: "/oauth/authorize"
                      code: 0
                      message: "OK"
                      time: "2026-02-27T12:48:15.123Z"
                    code: "22ecfe70-8fa2-8cf6-473e-d94f3f240c18"
                authorize-error:
                  summary: OTP kodu yanlış
                  value:
                    result:
                      cmd: "/oauth/authorize"
                      code: 401
                      message: "Error"
                      time: "2026-02-27T12:48:15.123Z"
                      extraErrorMessage: "Invalid OTP code"
                    code: null

  /oauth/token:
    post:
      operationId: getToken
      servers:
        - url: https://auth.kentkart.com/rl1
          name: auth
          description: OAuth kimlik doğrulama sunucusu
      tags: [Kart (Login Gerekli)]
      summary: 🎫 Token Al — Authorization Code → Access Token
      description: >
        OAuth akışının **3. adımı**. `/oauth/authorize`'dan gelen `code`'u
        `access_token` ile değiştirir.

        **⚠️ `grantType`: `"authorizationCode"` (camelCase)**

        `access_token` RS256 imzalı JWT'dir. Payload:
        - `sub` → kullanıcı ID
        - `sid` → session ID
        - `aud` → clientId (`rH7S2`)
        - `exp` → geçerlilik bitiş (Unix ts) — yaklaşık 5 gün
        - `pexp` → primary expiry — yaklaşık 1 gün
        - `scopes` → boş array

        Token, `/api/*` endpoint'lerinde şu şekilde kullanılır:
        ```
        Authorization: Bearer {access_token}
        ```
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/RegionParam'
        - $ref: '#/components/parameters/AuthTypeParam'
        - $ref: '#/components/parameters/LangParam'
        - $ref: '#/components/parameters/VersionParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequestBody'
            examples:
              code_exchange:
                summary: Authorization code ile token alma (gerçek istekten)
                value:
                  clientId: "rH7S2"
                  clientSecret: "Om121T12fSv1j66kp9Un5vE9IMkJ3639"
                  redirectUri: "m.kentkart.com"
                  code: "22ecfe70-8fa2-8cf6-473e-d94f3f240c18"
                  grantType: "authorizationCode"
      responses:
        '200':
          description: Access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                access-token:
                  summary: JWT access token ve refresh token (Doğrulandı 2026-02-27)
                  externalValue: './examples/token-response.json'

  /assets/config/appConfig.json:
    get:
      operationId: getAppConfig
      servers:
        - url: https://m.kentkart.com
          name: webapp
          description: Kentkart web uygulaması
      tags: [Yapılandırma]
      summary: ⚙️ Uygulama Yapılandırması
      description: >
        Kentkart web uygulamasının çalışma zamanı yapılandırmasını döner.

        **OAuth için kritik alanlar:**
        - `apiServer.clientId` — OAuth client kimliği
        - `apiServer.clientSecret` — OAuth client sırrı
        - `apiServer.authUrl` — Auth sunucu URL'si
        - `apiServer.redirectUri` — OAuth redirect URI
        - `apiServer.loginTypes[]` — Desteklenen giriş tipleri (`phone`)

        **Auth gerektirmez.** Herhangi bir tarayıcı veya curl ile erişilebilir.

        > ⚠️ `clientSecret` bu dosyada açık metin olarak bulunur.
        > Kentkart'ın kasıtlı olarak public yaptığı bir değerdir (SPA mimarisi gereği).
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
      responses:
        '200':
          description: Uygulama yapılandırması
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfig'
              examples:
                app-config:
                  summary: Kentkart web uygulaması yapılandırması (OAuth clientId/secret içerir)
                  externalValue: './examples/app-config.json'

# ─────────────────────────────────────────────────────────────
#  ETİKETLER (OpenAPI 3.1.0 uyumlu)
# ─────────────────────────────────────────────────────────────
tags:
  - name: Genel Bilgi
