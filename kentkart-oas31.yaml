                    items:
                      $ref: '#/components/schemas/StopItem'
                  placeList:
                    type: array
                    items:
                      type: object
              examples:
                univeriste-aramasi:
                  summary: "ÜNİVERSİTE" anahtar kelimesiyle arama
                  externalValue: './examples/search-response.json'

  /web/pathInfo:
    get:
      operationId: getPathInfo
      tags: [Hat Bilgileri]
      summary: 🚌 Hat Detayları (Bit Maskesi ile)
      description: >
        Bir hattın tüm verilerini `resultType` bit maskesiyle seçici olarak getirir.

        **Önerilen polling stratejisi:**
        - Canlı takip (her 10–15s) → `resultType=010000`
        - İlk yükleme           → `resultType=111110`
        - Standart görünüm      → `resultType=011000`

        **⚠️ Alan adı tutarsızlığı:** Bu endpoint'teki `busList[].plateNumber`,
        `/web/nearest/bus`'taki `busList[].plate` ile aynı veridir.
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/RefererHeader'
        - $ref: '#/components/parameters/RegionParam'
        - $ref: '#/components/parameters/LangParam'
        - $ref: '#/components/parameters/AuthTypeParam'
        - name: displayRouteCode
          in: query
          required: true
          description: Hat numarası (Örn. 52, 52A, 53A, 57)
          schema:
            type: string
            examples:
              - "52"
        - name: direction
          in: query
          required: true
          description: "Yön — 0=Gidiş, 1=Dönüş"
          schema:
            type: string
            enum: ["0", "1"]
            default: "0"
        - name: resultType
          in: query
          required: true
          description: >
            6 karakterlik bit maskesi. Her karakter '0' veya '1'.

            | Değer    | Dönen veri                         |
            |----------|------------------------------------|
            | `010000` | busList (canlı araçlar)            |
            | `001000` | busStopList (güzergah durakları)   |
            | `011000` | busList + busStopList              |
            | `100000` | pointList (polyline)               |
            | `111000` | pointList + busList + busStopList  |
            | `000100` | timeTableList (bugünün tarifesi)   |
            | `000010` | scheduleList (haftalık tarife)     |
            | `111110` | Tüm veriler                        |

            **⚠️ Bilinmeyen bit:** `000001` HTTP 200 döner ancak boş veri döner
            (test edildi 2026-02-28).
          schema:
            type: string
            pattern: '^[01]{6}$'
            examples:
              - "011000"
      responses:
        '200':
          description: >
            ⚠️ **Gerçek yanıt yapısı**: Tüm veriler `pathList[0]` içinde gömülü gelir.
            `busList`, `busStopList` vb. üst seviyede değil — `pathList[0].busList` şeklindedir.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/ResultObject'
                  pathList:
                    type: array
                    description: >
                      ⭐ Tek elemanlı array. `pathList[0]` içinde hat metadata VE
                      seçilen bit maskesine göre `busList`, `busStopList`, `timeTableList`,
                      `scheduleList` alanları gömülü olarak gelir.
                    items:
                      $ref: '#/components/schemas/PathItem'
              examples:
                hat-52-ornek:
                  summary: 52 numaralı hat - araçlar + duraklar (resultType=011000)
                  externalValue: './examples/pathinfo-response.json'

  /web/nearest/bus:
    get:
      operationId: getNearestBus
      tags: [Canlı Takip]
      summary: ⏱️ Durağa Yaklaşan Araçlar (ETA)
      description: >
        Belirtilen durak ID'sine yaklaşmakta olan aktif otobüsleri
        tahmini geliş süresi (`timeDiff`, dakika) ve kaç durak uzakta
        olduğuyla (`stopDiff`) birlikte döner.

        Ayrıca o durağa uğrayan tüm hatların sonraki programlı sefer
        saatini (`nextTripArrivalTime`) da içerir.
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/RefererHeader'
        - $ref: '#/components/parameters/RegionParam'
        - $ref: '#/components/parameters/LangParam'
        - $ref: '#/components/parameters/AuthTypeParam'
        - $ref: '#/components/parameters/AccuracyParam'
        - name: lat
          in: query
          required: true
          schema:
            type: string
            examples:
              - "40.976759"
        - name: lng
          in: query
          required: true
          schema:
            type: string
            examples:
              - "37.973872"
        - name: busStopId
          in: query
          required: true
          description: Durak ID'si
          schema:
            type: string
            examples:
              - "13000"
      responses:
        '200':
          description: ETA verileri
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/ResultObject'
                  stopInfo:
