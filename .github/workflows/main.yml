name: 🚀 Apply Bug Fixes

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '"evet" yazarak 5 dosyayi degistir'
        required: true
        default: 'evet'

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'evet'
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Dosyalari yaz
        run: |
          python3 - << 'PYEOF'
          import base64, os
          SCRIPT_B64 = ""
          exec(compile(base64.b64decode(SCRIPT_B64), "<w>", "exec"))
          PYEOF

      - name: 🔧 samsun.py patch
        run: |
          python3 - << 'PYEOF'
          import base64
          PATCH_B64 = ""
          new_section = base64.b64decode(PATCH_B64).decode("utf-8")
          with open("samsun.py", "r", encoding="utf-8") as f:
              lines = f.readlines()
          start = next((i for i,l in enumerate(lines) if "    def _enrich_hat(h):" in l), None)
          end   = next((i for i,l in enumerate(lines) if i > (start or 0) and l.startswith("    @app.get")), None)
          if start and end:
              lines[start:end] = [new_section]
              with open("samsun.py", "w", encoding="utf-8") as f:
                  f.writelines(lines)
              print(f"OK: samsun.py guncellendi (satirlar {start}-{end})")
          else:
              print("UYARI: _enrich_hat blogu bulunamadi")
          PYEOF

      - name: ✅ Kontrol
        run: |
          grep -n "setSelectedLine" frontend/src/components/transit/LinesTab.tsx
          grep -n "LineDetail" frontend/src/components/transit/TabContent.tsx
          grep -n "durak_sayisi" frontend/src/lib/api.ts
          grep -n "stop_counts" samsun.py | head -3

      - name: 📝 Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Degisiklik yok." || (
            git commit -m "fix: siyah ekran, hat detay, durak/fiyat gosterimi"
            git push
          )
