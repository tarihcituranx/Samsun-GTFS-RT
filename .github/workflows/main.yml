name: 🚀 Apply Bug Fixes

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Bu workflow, 5 dosyayı düzeltilmiş halleriyle değiştirir. "evet" yaz'
        required: true
        default: 'evet'

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'evet'
    
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Python ile dosyaları yaz (base64 decode)
        run: |
          python3 - << 'PYEOF'
          import base64, os
          
          SCRIPT_B64 = ""
          script = base64.b64decode(SCRIPT_B64)
          exec(compile(script, "<apply_fixes>", "exec"))
          print("✅ 5 dosya başarıyla yazıldı.")
          PYEOF

      - name: 🔧 samsun.py — _enrich_hat ve /api/hat endpoint güncelle
        run: |
          python3 - << 'PYEOF'
          import base64, re

          PATCH_B64 = ""
          new_section = base64.b64decode(PATCH_B64).decode("utf-8")

          with open("samsun.py", "r", encoding="utf-8") as f:
              content = f.read()

          # Eski _enrich_hat fonksiyonunu bul ve değiştir
          old_pattern = r'    def _enrich_hat\(h\):.*?return d\n'
          # Daha güvenli: satır numarasına göre eski bloğu bul ve yenisiyle değiştir
          lines = content.split("\n")
          
          # _enrich_hat başlangıcını bul
          start_idx = None
          end_idx = None
          for i, line in enumerate(lines):
              if "    def _enrich_hat(h):" in line:
                  start_idx = i
              if start_idx and i > start_idx and line.startswith("    @app.get"):
                  end_idx = i
                  break
          
          if start_idx and end_idx:
              new_lines = new_section.split("\n")
              lines[start_idx:end_idx] = new_lines
              with open("samsun.py", "w", encoding="utf-8") as f:
                  f.write("\n".join(lines))
              print(f"✅ samsun.py güncellendi (satır {start_idx}-{end_idx})")
          else:
              print("⚠️ samsun.py: _enrich_hat bloğu bulunamadı, manuel kontrol gerekli")
          PYEOF

      - name: ✅ Değişiklikleri kontrol et
        run: |
          echo "=== Değiştirilen dosyalar ==="
          git diff --name-only || echo "(henüz staged değil)"
          echo ""
          echo "=== LinesTab.tsx (setSelectedLine kontrolü) ==="
          grep -n "setSelectedLine" frontend/src/components/transit/LinesTab.tsx || echo "HATA: setSelectedLine bulunamadı!"
          echo ""
          echo "=== TabContent.tsx (LineDetail kontrolü) ==="
          grep -n "LineDetail\|selectedLine" frontend/src/components/transit/TabContent.tsx || echo "HATA: LineDetail bulunamadı!"
          echo ""
          echo "=== api.ts (durak_sayisi kontrolü) ==="
          grep -n "durak_sayisi" frontend/src/lib/api.ts || echo "HATA: durak_sayisi bulunamadı!"
          echo ""
          echo "=== samsun.py (stop_counts kontrolü) ==="
          grep -n "stop_counts\|durak_sayisi" samsun.py | head -5

      - name: 📝 Commit ve Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Değişiklik yok, commit atlanıyor." || (
            git commit -m "fix: siyah ekran, hat detay, durak/fiyat gösterimi düzeltildi

          - LinesTab: setDetailItem -> setSelectedLine
          - TabContent: LineDetail entegrasyonu eklendi
          - DetailPanel: hat tipi sag panelden cikarildi
          - api/hat: durak_sayisi ve tam_fiyat alanlari eklendi
          - api.ts: renk, durak_sayisi, tam_fiyat okunuyor
          - README: yeni mimari dokumantasyonu"
            git push
            echo "✅ Push başarılı!"
          )
