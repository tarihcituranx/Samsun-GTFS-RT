<!DOCTYPE html>
<html lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Samsun Ulaşım - Admin Girişi</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style type="text/tailwindcss">
        :root {
            --primary: #2979FF;
            --secondary: #00BFA5;
            --background: #0A1628;
            --surface: #152238;
            --surfaceAlt: #0F1E36;
            --surfaceLight: #1A2940;
            --error: #FF5252;
            --text: #FFFFFF;
            --textSecondary: rgba(255, 255, 255, 0.6);
            --textMuted: #546E8A;
            --divider: rgba(255, 255, 255, 0.08);
            --adminCyan: #4FC3F7;
        }
        body {
            background-color: var(--background);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .gradient-icon-bg {
            background: linear-gradient(135deg, var(--surfaceLight), var(--surfaceAlt));
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="h-screen flex flex-col overflow-hidden relative">
<main class="flex-1 flex flex-col items-center justify-center px-8 pb-24 w-full max-w-md mx-auto">
<div class="mb-8 relative">
<div class="w-32 h-32 rounded-full gradient-icon-bg flex items-center justify-center border border-[var(--divider)] relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-tr from-[var(--primary)] to-[var(--adminCyan)] opacity-10"></div>
<span class="material-symbols-outlined text-6xl text-[var(--adminCyan)]" style="font-size: 64px;">admin_panel_settings</span>
</div>
<div class="absolute inset-0 rounded-full bg-[var(--adminCyan)] blur-3xl opacity-10 -z-10"></div>
</div>
<div class="text-center mb-10 space-y-2">
<h1 class="text-3xl font-bold tracking-tight text-white">Admin Girişi</h1>
<p class="text-[var(--textSecondary)] text-sm font-medium">Sunucu yönetim paneli</p>
</div>
<form class="w-full space-y-6" onsubmit="event.preventDefault();">
<div class="space-y-2">
<label class="text-xs font-semibold uppercase tracking-wider text-[var(--textMuted)] ml-1" for="admin-key">Admin Key</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-[var(--textMuted)]">vpn_key</span>
</div>
<input class="block w-full pl-12 pr-4 py-4 bg-[var(--surface)] border border-[var(--divider)] rounded-xl text-white placeholder-[var(--textMuted)] focus:outline-none focus:ring-2 focus:ring-[var(--primary)] focus:border-transparent transition-all" id="admin-key" placeholder="••••••••••••" type="password"/>
</div>
</div>
<button class="w-full py-4 px-6 bg-[var(--primary)] hover:bg-blue-600 active:bg-blue-700 rounded-xl text-white font-bold text-base shadow-lg shadow-blue-900/20 transition-all flex items-center justify-center gap-2" type="submit">
<span>Giriş Yap</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</form>
<div class="mt-12 text-center">
<p class="text-[var(--textMuted)] text-xs">
                Bu alan sadece yetkili personel içindir.<br/>
                Samsun Ulaşım v2.4.0 (Build 1042)
            </p>
</div>
</main>
<nav class="fixed bottom-0 w-full bg-[var(--surfaceAlt)] border-t border-[var(--divider)] pb-6 pt-2 px-2 z-50">
<div class="flex justify-between items-center max-w-md mx-auto">
<button class="flex flex-col items-center justify-center w-full space-y-1 group">
<span class="material-symbols-outlined text-[var(--textMuted)] text-2xl group-active:scale-95 transition-transform">map</span>
<span class="text-[10px] text-[var(--textMuted)] font-medium">Harita</span>
</button>
<button class="flex flex-col items-center justify-center w-full space-y-1 group">
<span class="material-symbols-outlined text-[var(--textMuted)] text-2xl group-active:scale-95 transition-transform">directions_bus</span>
<span class="text-[10px] text-[var(--textMuted)] font-medium">Hatlar</span>
</button>
<button class="flex flex-col items-center justify-center w-full space-y-1 group">
<span class="material-symbols-outlined text-[var(--textMuted)] text-2xl group-active:scale-95 transition-transform">near_me</span>
<span class="text-[10px] text-[var(--textMuted)] font-medium">Yakınım</span>
</button>
<button class="flex flex-col items-center justify-center w-full space-y-1 group">
<span class="material-symbols-outlined text-[var(--textMuted)] text-2xl group-active:scale-95 transition-transform">directions</span>
<span class="text-[10px] text-[var(--textMuted)] font-medium">Rota</span>
</button>
<button class="flex flex-col items-center justify-center w-full space-y-1 group">
<span class="material-symbols-outlined text-[var(--textMuted)] text-2xl group-active:scale-95 transition-transform">photo_camera</span>
<span class="text-[10px] text-[var(--textMuted)] font-medium">Odak</span>
</button>
<button class="flex flex-col items-center justify-center w-full space-y-1 group">
<span class="material-symbols-outlined text-[var(--textMuted)] text-2xl group-active:scale-95 transition-transform">flight</span>
<span class="text-[10px] text-[var(--textMuted)] font-medium">SamAir</span>
</button>
<button class="flex flex-col items-center justify-center w-full space-y-1 group">
<span class="material-symbols-outlined text-[var(--primary)] text-2xl group-active:scale-95 transition-transform fill-1">admin_panel_settings</span>
<span class="text-[11px] text-[var(--primary)] font-semibold">Admin</span>
</button>
</div>
</nav>

</body></html>
