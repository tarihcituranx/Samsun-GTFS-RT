  /route/v1/driving/{coordinates}:
    get:
      operationId: getRoute
      servers:
        - url: https://mapservice.mgm.gov.tr
          description: MGM Harita Servisi
      tags: [Harita]
      summary: 🛣️ Rota Hesaplama (Driving)
      description: >
        İki nokta arasında araç rotası hesaplar. OSRM (Open Source Routing Machine) formatında döner.
        KTHS (Karayolları Hava Tahmin Sistemi) tarafından kullanılır.

        **Koordinat formatı:** `boylam,enlem;boylam,enlem` (WGS84)

        **Not:** Origin header gerekmez.
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - name: coordinates
          in: path
          required: true
          description: >
            Başlangıç ve bitiş koordinatları (boylam,enlem;boylam,enlem)
          schema:
            type: string
            examples:
              - "36.2526309,41.3246162;28.8208,40.9819"
        - name: steps
          in: query
          required: false
          description: Adım adım yönergeleri dahil et
          schema:
            type: boolean
            examples:
              - true
        - name: alternatives
          in: query
          required: false
          description: Alternatif rotaları dahil et
          schema:
            type: boolean
            examples:
              - true
        - name: geometries
          in: query
          required: false
          description: Geometri formatı
          schema:
            type: string
            enum: [geojson, polyline, polyline6]
            examples:
              - "geojson"
        - name: overview
          in: query
          required: false
          description: Rota özeti seviyesi
          schema:
            type: string
            enum: [simplified, full, false]
            examples:
              - "full"
        - name: annotations
          in: query
          required: false
          description: Ek bilgileri dahil et
          schema:
            type: boolean
            examples:
              - true
      responses:
        '200':
          description: Rota bilgisi
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    examples:
                      - "Ok"
                  routes:
                    type: array
                    items:
                      type: object
        '400':
          description: Geçersiz koordinat formatı
        '404':
          description: Rota bulunamadı

  /nominatim/reverse.php:
    get:
      operationId: reverseGeocode
      servers:
        - url: https://mapservice.mgm.gov.tr
          description: MGM Harita Servisi
      tags: [Harita]
      summary: 📍 Koordinattan Adres (Reverse Geocoding)
      description: >
        GPS koordinatlarını adres bilgisine çevirir. Nominatim API'si.
        KTHS tarafından kullanılır.

        **⚠️ DURUM:** Bu endpoint şu an çalışmıyor (500 Internal Server Error).
        Test edilen tüm koordinatlar (Ankara, İstanbul, Samsun) ve zoom seviyeleri
        (5, 8, 10, 14) 500 hatası döndürüyor (2026-02-28).

        **Çoklu Koordinat:** `coords` parametresi ile birden fazla koordinat sorgulanabilir.
        Format: `lat1,lon1;lat2,lon2;lat3,lon3`
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - name: coords
          in: query
          required: false
          description: >
            Çoklu koordinatlar (noktalı virgül ile ayrılmış).
            Örnek: `39.98,32.83;40.43,32.42`
          schema:
            type: string
            examples:
              - "39.9867904,32.833536;40.432302,32.422893"
        - name: format
          in: query
          required: true
          description: Yanıt formatı
          schema:
            type: string
            enum: [json, xml]
            examples:
              - "json"
        - name: lat
          in: query
          required: true
          description: Enlem (latitude)
          schema:
            type: number
            format: double
            examples:
              - 41.3246162
        - name: lon
          in: query
          required: true
          description: Boylam (longitude)
          schema:
            type: number
            format: double
            examples:
              - 36.2526309
        - name: zoom
          in: query
          required: false
          description: >
            Zoom seviyesi (0-18). Daha yüksek zoom = daha detaylı adres.
          schema:
            type: integer
            minimum: 0
            maximum: 18
            examples:
              - 14
      responses:
        '200':
          description: Adres bilgisi
          content:
            application/json:
              schema:
                type: object
                properties:
                  place_id:
                    type: integer
                  display_name:
                    type: string
                    examples:
                      - "Atakum, Samsun, Türkiye"
                  lat:
                    type: string
                    examples:
                      - "41.3246162"
                  lon:
                    type: string
                    examples:
                      - "36.2526309"
        '400':
          description: Geçersiz koordinatlar
        '404':
          description: Adres bulunamadı

  /web/modeltahmin/lokasyon/light3:
    get:
      operationId: getModelTahminLokasyon
      servers:
        - url: https://modelservis.mgm.gov.tr
          description: MGM Model Tahmin Servisi
      tags: [Model Tahmin]
      summary: 🛣️ Lokasyon Bazlı Model Tahmini (KTHS)
      description: >
        İki nokta arası yol güzergahı için model tabanlı hava tahmini döner.
        KTHS (Karayolları Hava Tahmin Sistemi) karayolları hava tahmini için kullanılır.

        **⚠️ Önemli:** Tek koordinat ile timeout alabilirsiniz. **En az 2 lokasyon** gönderin.
        - `enlem=39.9334_41.0082&boylam=32.8597_28.9784` (Ankara → İstanbul)

        **Yanıt:** Her zaman adımı için sıcaklık, nem, yağış, rüzgar, bulutlulik vb.

        **⚠️ IP Kısıtlaması:** Türkiye IP adreslerinden erişim gerektirir.
        Yurtdışından timeout hatası alırsınız. Türkiye içinden test ediniz.

        **Doğrulandı (2026-02-28):** Ankara → İstanbul rotası başarıyla test edildi.
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - name: enlem
          in: query
          required: true
          description: Enlem koordinatları (alt çizgi ile ayrılmış)
          schema:
            type: string
            examples:
              - "39.9334_41.0082"
        - name: boylam
          in: query
          required: true
          description: Boylam koordinatları (alt çizgi ile ayrılmış)
          schema:
            type: string
            examples:
              - "32.8597_28.9784"
        - name: tarih
          in: query
          required: true
          description: Başlangıç tarihi ve saati (YYYY-MM-DD HH:mm)
          schema:
            type: string
            format: date-time
            examples:
              - "2026-02-28 16:00"
        - name: step
          in: query
          required: true
          description: Zaman adımı (dakika cinsinden, örn. 60 = saatlik tahminler)
          schema:
            type: integer
            examples:
              - 60
      responses:
        '200':
          description: Model tahmin verisi
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    tarih:
                      type: string
                      format: date-time
                      description: Tahmin zamanı
                    sicaklik:
                      type: number
                      description: Sıcaklık (°C)
                    hissedilenSicaklik:
                      type: number
                      description: Hissedilen sıcaklık (°C)
                    saatlikToplamYagis:
                      type: number
                      description: Saatlik toplam yağış (mm)
                    karYuksekligi:
                      type: number
                      description: Kar yüksekliği (cm)
                    bulutKapaliligi:
                      type: integer
                      description: Bulut kapalılığı (%)
                    nem:
                      type: integer
                      description: Nem (%)
                    basinc:
                      type: integer
                      description: Basınç (hPa)
                    ruzgarHizi:
                      type: integer
                      description: Rüzgar hızı (km/s)
                    ruzgarYonu:
                      type: integer
                      description: Rüzgar yönü (derece)
                    hadise:
                      type: string
                      description: Hava durumu kodu
                    enlem:
                      type: number
                      description: Lokasyon enlemi
                    boylam:
                      type: number
                      description: Lokasyon boylamı
                    yolSaati:
                      type: string
                      format: date-time
                      description: Yol saati
                    yolEnlem:
                      type: number
                      description: Yol enlemi
                    yolBoylam:
                      type: number
                      description: Yol boylamı
              examples:
                ankara-istanbul:
                  summary: Ankara → İstanbul rotası
                  externalValue: './examples/modeltahmin-ankara-istanbul-response.json'
        '400':
          description: Geçersiz parametreler
        '404':
          description: Veri bulunamadı

