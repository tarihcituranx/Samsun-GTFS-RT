openapi: "3.1.0"
# Bu dosya OAS 3.1.0 formatındadır. OAS 3.2.0 için openapi.yaml dosyasına bakın.


info:
  title: MGM Servis API — Meteoroloji Genel Müdürlüğü
  summary: MGM'nin resmi web sitesinin kullandığı dahili servis API'si.
  contact:
    name: Turan KAYA
    url: https://github.com/tarihcituranx
  description: >
    **API Şema Geliştiricisi:** [Turan KAYA](https://github.com/tarihcituranx)

    ---

    Meteoroloji Genel Müdürlüğü'nün (MGM) resmi web sitesi tarafından kullanılan
    dahili servis API'si. Gerçek API testleriyle (Şubat 2026, Samsun/Atakum) doğrulanmıştır.

    ---

    ## Kimlik Doğrulama

    Token veya API anahtarı **gerekmez**. Her istekte şu header zorunludur:

    ```
    Origin: https://www.mgm.gov.tr
    ```

    Bu header olmadan istekler reddedilir.

    ---

    ## Kullanım Akışı

    ```
    1. GET /web/merkezler?il={İl}
          → merkezId, sondurumIstNo, gunlukTahminIstNo, saatlikTahminIstNo al

    2. GET /web/sondurumlar?merkezid={merkezId}
          → Anlık ölçümler (sıcaklık, nem, rüzgar, yağış...)

    3. GET /web/tahminler/gunluk?istno={gunlukTahminIstNo}
          → Bugün dahil 6 günlük tahmin (Gun0–Gun5)

    4. GET /web/tahminler/saatlik?istno={saatlikTahminIstNo}
          → 3'er saatlik dilimler halinde tahmin

    5. GET /web/ucdegerler?merkezid={merkezId}&ay={ay}&gun={gun}
          → Tarihi rekordlar (max/min/ort)
    ```

    ⚠️ **Önemli:** Şehir merkezi ile ilçelerin istasyon ID'leri farklıdır.
    Doğru veri için mutlaka ilçe bazlı ID'ler kullanılmalıdır.

    ---

    ## Hadise Kodları

    | Kod  | Anlam                |
    |------|----------------------|
    | AK   | Açık                 |
    | AB   | Az Bulutlu           |
    | PB   | Parçalı Bulutlu      |
    | CB   | Çok Bulutlu          |
    | HY   | Hafif Yağmurlu       |
    | Y    | Yağmurlu             |
    | KY   | Kuvvetli Yağmurlu    |
    | HSY  | Hafif Sisli Yağışlı  |
    | HKY  | Hafif Karlı Yağışlı  |
    | KAR  | Karlı                |
    | SIS  | Sisli                |
    | KF   | Kum Fırtınası        |

    ---

    ## Özel Değer: -9999

    `-9999` değeri "veri yok / ölçüm yapılmadı" anlamına gelir.
    Deniz sıcaklığı, kar yüksekliği gibi alanlarda yaygın görülür.

  version: "1.5.0"
  contact:
    name: Meteoroloji Genel Müdürlüğü
    url: https://www.mgm.gov.tr
  x-maintainer:
    name: Turan KAYA (tarihcituranx)
    url: https://github.com/tarihcituranx
  license:
    name: Kamuya Açık — Resmi MGM Servisi

servers:
  - url: https://servis.mgm.gov.tr
    description: MGM ana veri sunucusu (tüm /web/ endpoint'leri)
  - url: https://www.mgm.gov.tr
    description: MGM ana web sunucusu (radar JPEG görüntüleri — /FTPDATA/...)
  - url: https://pirireis.mgm.gov.tr
    description: MGM Piri Reis denizcilik portalı
  - url: https://hezarfen.mgm.gov.tr
    description: MGM Hezarfen havacılık sistemi
  - url: https://mapservice.mgm.gov.tr
    description: MGM Harita Servisi (routing, geocoding) — Origin header gerekmez
  - url: https://modelservis.mgm.gov.tr
    description: MGM Model Tahmin Servisi (KTHS) — **Origin header ZORUNLU**

# ─────────────────────────────────────────────────────────────
#  ORTAK BİLEŞENLER
# ─────────────────────────────────────────────────────────────
components:

  parameters:

    OriginHeader:
      name: Origin
      in: header
      required: true
      description: >
        ⚠️ **Zorunlu.** Bu header olmadan tüm istekler reddedilir.
        Sabit değer: `https://www.mgm.gov.tr`
      schema:
        type: string
        enum:
          - "https://www.mgm.gov.tr"
        examples:
          - "https://www.mgm.gov.tr"

    MerkezIdParam:
      name: merkezid
      in: query
      required: true
      description: >
        Merkez ID. `/web/merkezler`'den dönen `merkezId` alanı.
        Örn: Samsun/Atakum = 95501
      schema:
        type: integer
        examples:
          - 95501

    IstNoParam:
      name: istno
      in: query
      required: true
      description: İstasyon numarası. Kullanım amacına göre `gunlukTahminIstNo` veya `saatlikTahminIstNo` seçilir.
      schema:
        type: integer
        examples:
          - 17030

  schemas:

    Merkez:
      type: object
      description: >
        Bir meteoroloji merkezi/istasyonu. `/web/merkezler` endpoint'inden döner.
        Doğrulandı: Samsun/Atakum (2026-02-27).
      properties:
        merkezId:
          type: integer
          description: "⭐ Merkez kimlik numarası. sondurumlar ve ucdegerler için kullanılır."
          examples:
            - 95501
        il:
          type: string
          examples:
            - "Samsun"
        ilPlaka:
          type: integer
          examples:
            - 55
        ilce:
          type: string
          examples:
            - "Atakum"
        enlem:
          type: number
          format: double
          examples:
            - 41.3442
        boylam:
          type: number
          format: double
          examples:
            - 36.2564
        yukseklik:
          type: integer
          description: Denizden yükseklik (metre)
          examples:
            - 4
        sondurumIstNo:
          type: integer
          description: "⭐ Anlık durum sorgusu için istasyon no → /web/sondurumlar"
          examples:
            - 17030
        gunlukTahminIstNo:
          type: integer
          description: "⭐ Günlük tahmin için istasyon no → /web/tahminler/gunluk"
          examples:
            - 95501
        saatlikTahminIstNo:
          type: integer
          description: "⭐ Saatlik tahmin için istasyon no → /web/tahminler/saatlik"
          examples:
            - 17030
        alternatifHadiseIstNo:
          type: ["integer", "null"]
          description: Alternatif hadise istasyon numarası (null olabilir)
          examples:
            - null
        oncelik:
          type: integer
          description: Gösterim önceliği (1=birincil)
          examples:
            - 1
        modelId:
          type: integer
          examples:
            - 136008
        gps:
          type: integer
          description: "GPS verisi var mı (1=evet)"
          examples:
            - 1
        aciklama:
          type: string
          examples:
            - ""

    SonDurum:
      type: object
      description: >
        Anlık hava durumu ölçümleri. `/web/sondurumlar` endpoint'inden döner.
        Doğrulandı: Samsun/Atakum, merkezId=95501 (2026-02-27).

        **`-9999` değeri:** Veri yok / ölçüm yapılmadı anlamına gelir.
        (Örn: iç istasyonlarda `denizSicaklik`, kış dışında `karYukseklik`)
      properties:
        istNo:
          type: integer
          description: İstasyon numarası
          examples:
            - 17030
        veriZamani:
          type: string
          format: date-time
          description: Ölçüm zamanı (ISO 8601)
          examples:
            - "2026-02-27T13:14:00.000Z"
        sicaklik:
          type: number
          description: Sıcaklık (°C)
          examples:
            - 4.6
        hissedilenSicaklik:
          type: number
          description: Hissedilen sıcaklık (°C)
          examples:
            - 4.6
        nem:
          type: integer
          description: Bağıl nem (%)
          examples:
            - 88
        ruzgarHiz:
          type: number
          description: Rüzgar hızı (km/s)
          examples:
            - 18
        ruzgarYon:
          type: integer
          description: "Rüzgar yönü (0-360°, 0=Kuzey)"
          examples:
            - 356
        hadiseKodu:
          type: string
          description: >
            Hava durumu hadise kodu. Bilinen değerler:
            AK, AB, PB, CB, HY, Y, KY, HSY, HKY, KAR, SIS, KF
          examples:
            - "HSY"
        aktuelBasinc:
          type: number
          description: Aktüel basınç (hPa)
          examples:
            - 1019.4
        denizeIndirgenmisBasinc:
          type: number
          description: Denize indirgenmiş basınç (hPa)
          examples:
            - 1019.8
        gorus:
          type: integer
          description: Görüş mesafesi (metre)
          examples:
            - 10000
        kapalilik:
          type: integer
          description: "Bulutluluk (okta, 0-8). -9999 = veri yok."
          examples:
            - 7
        karYukseklik:
          type: number
          description: "Kar yüksekliği (cm). -9999 = kar yok / veri yok."
          examples:
            - -9999
        denizSicaklik:
          type: number
          description: "Deniz yüzeyi sıcaklığı (°C). -9999 = deniz istasyonu değil."
          examples:
            - 9.5
        denizVeriZamani:
          type: string
          format: date-time
          description: Deniz ölçüm zamanı
          examples:
            - "2026-02-27T06:00:00.000Z"
        yagis00Now:
          type: number
          description: Anlık yağış (mm)
          examples:
            - 12.1
        yagis10Dk:
          type: number
          description: Son 10 dakika yağış (mm)
          examples:
            - 0.6
        yagis1Saat:
          type: number
          description: Son 1 saat yağış (mm)
          examples:
            - 2
        yagis6Saat:
          type: number
          description: Son 6 saat yağış (mm)
          examples:
            - 8.3
        yagis12Saat:
          type: number
          description: Son 12 saat yağış (mm)
          examples:
            - 12
        yagis24Saat:
          type: number
          description: Son 24 saat yağış (mm)
          examples:
            - 12.9
        rasatMetar:
          type: string
          description: METAR formatı rasat (-9999 = mevcut değil)
          examples:
            - "-9999"
        rasatSinoptik:
          type: string
          description: Sinoptik rasat (-9999 = mevcut değil)
          examples:
            - "-9999"
        rasatTaf:
          type: string
          description: TAF formatı (-9999 = mevcut değil)
          examples:
            - "-9999"

    GunlukTahmin:
      type: object
      description: >
        6 günlük hava tahmini. `/web/tahminler/gunluk` endpoint'inden döner.
        `Gun0` = bugün, `Gun5` = 5 gün sonra.
        Doğrulandı: istno=95501, Samsun/Atakum (2026-02-27).

        ⚠️ `Gun0` alanları bu yanıtta **bulunmaz** — sunucu bugünü atlamaktadır.
        Yanıt `Gun1`–`Gun5` arasındadır (5 gün).
      properties:
        istNo:
          type: integer
          examples:
            - 95501
        tarihGun1:
          type: string
          format: date
          examples:
            - "2026-02-28"
        enDusukGun1:
          type: number
          description: En düşük sıcaklık (°C)
          examples:
            - 4
        enYuksekGun1:
          type: number
          description: En yüksek sıcaklık (°C)
          examples:
            - 6
        enDusukNemGun1:
          type: integer
          examples:
            - 82
        enYuksekNemGun1:
          type: integer
          examples:
            - 93
        hadiseGun1:
          type: string
          description: Hadise kodu (bkz. hadise kodları tablosu)
          examples:
            - "Y"
        ruzgarHizGun1:
          type: number
          description: Rüzgar hızı (km/s)
          examples:
            - 27
        ruzgarYonGun1:
          type: integer
          examples:
            - 310
        tarihGun2:
          type: string
          format: date
        enDusukGun2:
          type: number
        enYuksekGun2:
          type: number
        enDusukNemGun2:
          type: integer
        enYuksekNemGun2:
          type: integer
        hadiseGun2:
          type: string
        ruzgarHizGun2:
          type: number
        ruzgarYonGun2:
          type: integer
        tarihGun3:
          type: string
          format: date
        enDusukGun3:
          type: number
        enYuksekGun3:
          type: number
        enDusukNemGun3:
          type: integer
        enYuksekNemGun3:
          type: integer
        hadiseGun3:
          type: string
        ruzgarHizGun3:
          type: number
        ruzgarYonGun3:
          type: integer
        tarihGun4:
          type: string
          format: date
        enDusukGun4:
          type: number
        enYuksekGun4:
          type: number
        enDusukNemGun4:
          type: integer
        enYuksekNemGun4:
          type: integer
        hadiseGun4:
          type: string
        ruzgarHizGun4:
          type: number
        ruzgarYonGun4:
          type: integer
        tarihGun5:
          type: string
          format: date
        enDusukGun5:
          type: number
        enYuksekGun5:
          type: number
        enDusukNemGun5:
          type: integer
        enYuksekNemGun5:
          type: integer
        hadiseGun5:
          type: string
        ruzgarHizGun5:
          type: number
        ruzgarYonGun5:
          type: integer

    SaatlikTahminItem:
      type: object
      description: Tek bir 3 saatlik tahmin dilimi.
      properties:
        tarih:
          type: string
          format: date-time
          examples:
            - "2026-02-27T15:00:00.000Z"
        hadise:
          type: string
          description: Hadise kodu
          examples:
            - "KY"
        sicaklik:
          type: number
          examples:
            - 4
        hissedilenSicaklik:
          type: number
          examples:
            - 4
        nem:
          type: integer
          examples:
            - 93
        ruzgarYonu:
          type: integer
          examples:
            - 310
        ruzgarHizi:
          type: number
          description: Ortalama rüzgar hızı (km/s)
          examples:
            - 30
        maksimumRuzgarHizi:
          type: number
          description: Maksimum rüzgar hızı (km/s)
          examples:
            - 55

    SaatlikTahminWrapper:
      type: object
      description: >
        Saatlik tahmin wrapper nesnesi. `/web/tahminler/saatlik` endpoint'inden döner.
        Doğrulandı: istno=17030, Samsun/Atakum (2026-02-27).
      properties:
        istNo:
          type: integer
          examples:
            - 17030
        merkez:
          type: string
          description: Merkez adı
          examples:
            - "Samsun"
        baslangicZamani:
          type: string
          format: date-time
          description: Tahminin başlangıç zamanı
          examples:
            - "2026-02-27T12:00:00.000Z"
        tahmin:
          type: array
          description: 3 saatlik tahmin dilimleri
          items:
            $ref: '#/components/schemas/SaatlikTahminItem'

    UcDeger:
      type: object
      description: >
        Tarihi uç değer (rekor). `/web/ucdegerler` endpoint'inden döner.
        Doğrulandı: merkezId=95501, ay=2, gun=27, Samsun/Atakum (2026-02-27).
      properties:
        merkezId:
          type: integer
          examples:
            - 95501
        istNo:
          type: integer
          examples:
            - 95501
        ay:
          type: integer
          examples:
            - 2
        gun:
          type: integer
          examples:
            - 27
        max:
          type: number
          description: Tarihi en yüksek sıcaklık rekoru (°C)
          examples:
            - 24.5
        min:
          type: number
          description: Tarihi en düşük sıcaklık rekoru (°C)
          examples:
            - -5.6
        ort:
          type: number
          description: Tarihi ortalama sıcaklık (°C)
          examples:
            - 8
        maxOrt:
          type: number
          description: Tarihi ortalama maksimum sıcaklık (°C)
          examples:
            - 12.2
        minOrt:
          type: number
          description: Tarihi ortalama minimum sıcaklık (°C)
          examples:
            - 4.4

    Alarm:
      type: object
      description: Meteoroloji uyarısı. `/web/alarmlar` endpoint'inden döner. Doğrulandı 2026-02-27.
      properties:
        seriNo:
          type: string
          description: Uyarı seri numarası
          examples:
            - "26010175"
        baslangic:
          type: string
          format: date-time
          description: Uyarı başlangıç zamanı
          examples:
            - "2026-02-26T20:15:00.000Z"
        baslik:
          type: string
          description: Uyarı başlığı
          examples:
            - "Doğu Akdeniz'de Kuvvetli Rüzgar ve Fırtınaya Dikkat!"
        hadiseCinsi:
          type: string
          description: >
            Uyarı hadise türü. Boş string olabilir (genel uyarılarda).
            Bilinen değerler: "Fırtına", "Kar Yağışı", "Sağanak Yağış", "Kuvvetli Rüzgar"
          examples:
            - "Fırtına"
        ihbarTipi:
          type: integer
          description: >
            İhbar tipi kodu. Bilinen değerler:
            1 = Meteoroloji Uyarısı (kırmızı/turuncu seviye),
            2 = Genel Duyuru / Bilgilendirme,
            4 = Denizcilik Uyarısı (fırtına, dalga)
          enum: [1, 2, 3, 4]
          examples:
            - 1

    MeteoAlarm:
      type: object
      description: >
        Avrupa MeteoAlarm formatında günlük uyarı.
        `/web/meteoalarm/today` endpoint'inden döner. Doğrulandı 2026-02-27.
      properties:
        _id:
          type: string
          examples:
            - "69a0ab8d88f30e14ccc096eb"
        alertNo:
          type: integer
          examples:
            - 2026022604
        begin:
          type: string
          format: date-time
          examples:
            - "2026-02-26T21:00:00.000Z"
        end:
          type: string
          format: date-time
          examples:
            - "2026-02-27T15:00:00.000Z"
        text:
          type: object
          description: Uyarı metni seviyelere göre (yellow/orange/red)
          properties:
            yellow:
              type: string
              examples:
                - "Kuvvetli rüzgar ve fırtınanın etkili olması beklenmektedir."
            orange:
              type: string
            red:
              type: string
        weather:
          type: object
          description: Etkilenen hava olayları seviyelere göre
          properties:
            yellow:
              type: array
              items:
                type: string
              examples:
                - ["wind"]
            orange:
              type: array
              items:
                type: string
            red:
              type: array
              items:
                type: string
        towns:
          type: object
          description: Etkilenen ilçe kodları seviyelere göre
          properties:
            yellow:
              type: array
              items:
                type: integer
              examples:
                - [90102, 90105, 90108]
            orange:
              type: array
              items:
                type: integer
            red:
              type: array
              items:
                type: integer

    KarKalinligi:
      type: object
      description: Kar kalınlığı ölçümü. `/web/sondurumlar/kar` endpoint'inden döner.
      properties:
        istNo:
          type: integer
          examples:
            - 18672
        istAd:
          type: string
          examples:
            - "Samsun / LADİK/AKDAĞ KAYAK MERKEZİ"
        karYukseklik:
          type: integer
          description: Kar kalınlığı (cm)
          examples:
            - 13
        veriZamani:
          type: string
          format: date-time
          examples:
            - "2026-02-26T00:38:00.000Z"
        enlem:
          type: number
          examples:
            - 40.9
        boylam:
          type: number
          examples:
            - 35.9

    DenizSuyuIstasyonu:
      type: object
      description: >
        Deniz/göl suyu sıcaklık istasyonu. `pirireis.mgm.gov.tr/deniz-suyu-sicakliklari`
        sayfasından kazınan JSON verisinden elde edilir.
      properties:
        istNo:
          type: integer
          description: İstasyon numarası
          examples:
            - 17034
        istAd:
          type: string
          description: İstasyon adı (il/ilçe/yer formatında)
          examples:
            - "İLKADIM/SAMSUN LİMAN KUZEY MENDİREK FENERİ"
        il:
          type: string
          examples:
            - "Samsun"
        ilce:
          type: string
          examples:
            - "İlkadım"
        denizSicaklik:
          type: number
          description: Deniz/göl yüzeyi sıcaklığı (°C)
          examples:
            - 9.5
        denizVeriZamani:
          type: string
          format: date-time
          description: Ölçüm zamanı (ISO 8601 UTC)
          examples:
            - "2026-02-26T06:00:00.000Z"
        enlem:
          type: number
          format: double
          examples:
            - 41.3
        boylam:
          type: number
          format: double
          examples:
            - 36.33

    TarimsalTahmin:
      type: object
      description: >
        Tarımsal hava tahmini verisi. `/web/tahminler/tarimsal` endpoint'inden döner.
        Tarım MGM uygulaması için özel tahmin verileri içerir.
      properties:
        gun:
          type: string
          description: Tahmin günü (ISO 8601 formatında)
          examples:
            - "2026-02-28"
        ortSicaklik:
          type: number
          description: Ortalama sıcaklık (°C)
          examples:
            - 8.5
        minSicaklik:
          type: number
          description: Minimum sıcaklık (°C)
          examples:
            - 4.2
        maxSicaklik:
          type: number
          description: Maksimum sıcaklık (°C)
          examples:
            - 12.8
        yagisOlasiligi:
          type: integer
          description: Yağış olasılığı (%)
          examples:
            - 20
        ruzgarHiz:
          type: number
          description: Rüzgar hızı (km/s)
          examples:
            - 15.5
        ruzgarYon:
          type: integer
          description: Rüzgar yönü (derece, 0=Kuzey)
          examples:
            - 356
        nem:
          type: integer
          description: Bağıl nem (%)
          examples:
            - 75
        hadiseKodu:
          type: string
          description: Hava durumu hadise kodu
          examples:
            - "PB"

    YagisVerisi:
      type: object
      description: >
        Günlük yağış verisi. `/web/sondurumlar/toplamyagis` endpoint'inden döner.
      properties:
        istNo:
          type: integer
          description: İstasyon numarası
          examples:
            - 17030
        tarih:
          type: string
          format: date
          description: Tarih (YYYY-MM-DD)
          examples:
            - "2026-02-28"
        toplamYagis:
          type: number
          description: Toplam yağış miktarı (mm)
          examples:
            - 12.5
        veriZamani:
          type: string
          format: date-time
          description: Veri ölçüm zamanı
          examples:
            - "2026-02-28T18:00:00.000Z"

    SicaklikVerisi:
      type: object
      description: >
        Günlük sıcaklık verisi. `/web/sondurumlar/endusuk`, `/web/sondurumlar/toprakustu`,
        ve `/web/sondurumlar/enyuksek` endpoint'lerinden döner.
      properties:
        istNo:
          type: integer
          description: İstasyon numarası
          examples:
            - 17030
        tarih:
          type: string
          format: date
          description: Tarih (YYYY-MM-DD)
          examples:
            - "2026-02-28"
        deger:
          type: number
          description: Sıcaklık değeri (°C)
          examples:
            - 4.2
        veriZamani:
          type: string
          format: date-time
          description: Veri ölçüm zamanı
          examples:
            - "2026-02-28T06:00:00.000Z"

    MarinaDetay:
      type: object
      description: >
        Marina bilgisi. `pirireis.mgm.gov.tr/marinalar/{id}` sayfasından kazınan
        `__NEXT_DATA__` JSON içindeki marina nesnesi.
      properties:
        id:
          type: integer
          description: Marina ID numarası
          examples:
            - 1
        name:
          type: string
          description: Marina adı
          examples:
            - "Hopa Limanı"
        lat:
          type: number
          format: double
          description: Enlem
          examples:
            - 41.4192
        lon:
          type: number
          format: double
          description: Boylam
          examples:
            - 41.4292
        isShowMap:
          type: boolean
          description: Haritada gösterilsin mi
          examples:
            - true

    WW3DalgaModeli:
      type: object
      description: >
        WaveWatch3 (WW3) dalga modeli verisi. `pirireis.mgm.gov.tr/marinalar/{id}`
        sayfasından kazınan JSON içindeki dalga tahmin nesnesi.
      properties:
        date:
          type: string
          format: date-time
          description: Tahmin zamanı (ISO 8601 UTC)
          examples:
            - "2026-02-26T03:00:00.000Z"
        hs:
          type: number
          description: Belirgin dalga yüksekliği (metre)
          examples:
            - 0.005
        dir:
          type: number
          description: Dalga yönü (derece, 0=Kuzey)
          examples:
            - 33.36
        t01:
          type: number
          description: Ortalama dalga periyodu (saniye)
          examples:
            - 2.22
        ws:
          type: number
          description: Modele yansıyan rüzgar hızı (m/s)
          examples:
            - 5.38

    EcmwfRuzgarModeli:
      type: object
      description: >
        ECMWF rüzgar modeli verisi. `pirireis.mgm.gov.tr/marinalar/{id}`
        sayfasından kazınan JSON içindeki rüzgar tahmin nesnesi.
      properties:
        date:
          type: string
          format: date-time
          description: Tahmin zamanı (ISO 8601 UTC)
          examples:
            - "2026-02-26T03:00:00.000Z"
        ws:
          type: number
          description: Rüzgar hızı (m/s)
          examples:
            - 3.23
        wd:
          type: number
          description: Rüzgar yönü (derece, 0=Kuzey)
          examples:
            - 5.78
        t2:
          type: number
          description: 2 metre yüzey sıcaklığı (°C)
          examples:
            - 3.29
        msl:
          type: number
          description: Deniz seviyesi basıncı (hPa)
          examples:
            - 1022.54
        weather:
          type: string
          description: Hava durumu hadise kodu (MGM formatı, örn. KKY)
          examples:
            - "KKY"

# ─────────────────────────────────────────────────────────────
#  ENDPOINT'LER
# ─────────────────────────────────────────────────────────────
paths:

  /web/merkezler:
    get:
      operationId: getMerkezler
      tags: [Merkezler]
      summary: 🗺️ İl/İlçe Merkez Listesi
      description: >
        Belirtilen ile (ve varsa ilçeye) ait meteoroloji istasyonlarını döner.
        **Kullanım akışının ilk adımıdır** — diğer tüm endpoint'ler için gereken
        ID'ler buradan alınır.

        Sadece `il` parametresi verilirse o ilin tüm ilçe istasyonları döner.
        `il` + `ilce` verilirse tek istasyon döner (array içinde).

        **Doğrulandı:** Samsun/Atakum → `merkezId=95501` (2026-02-27)
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - name: il
          in: query
          required: true
          description: İl adı (Türkçe, büyük harfle başlayabilir)
          schema:
            type: string
            examples:
              - "Samsun"
              - "Ankara"
              - "İstanbul"
        - name: ilce
          in: query
          required: false
          description: İlçe adı (Türkçe) — verilirse tek istasyon döner
          schema:
            type: string
            examples:
              - "Atakum"
        - name: sorgu
          in: query
          required: false
          description: Arama sorgusu (autocomplete için) — il/ilçe arama
          schema:
            type: string
            examples:
              - "ist"
        - name: limit
          in: query
          required: false
          description: Maksimum sonuç sayısı (sorgu ile birlikte kullanılır)
          schema:
            type: integer
            default: 50
            examples:
              - 50
      responses:
        '200':
          description: Merkez listesi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Merkez'
              examples:
                samsun-atakum:
                  summary: Samsun/Atakum (tek ilçe)
                  externalValue: './examples/merkezler-response.json'

  /web/merkezler/iller:
    get:
      operationId: getMerkezlerIller
      tags: [Merkezler]
      summary: 🏙️ Tüm İl Merkezleri Listesi
      description: >
        Türkiye'deki tüm 81 ilin ana meteoroloji merkezi bilgilerini döner.
        Dönen yapı `Merkez` şemasıyla aynıdır.

        **Doğrulandı:** 81 kayıt (2026-02-27)
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
      responses:
        '200':
          description: Tüm il merkezleri
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Merkez'
              examples:
                tum-iller:
                  summary: Tüm 81 il merkezi (ilk 3 kayıt)
                  externalValue: './examples/merkezler-iller-response.json'

  /web/merkezler/ililcesi:
    get:
      operationId: getIlIlcesi
      tags: [Merkezler]
      summary: 🏘️ İl İlçe Listesi
      description: >
        Belirtilen ilin tüm ilçelerinin listesini döner.
        Tarım MGM uygulaması tarafından kullanılır.

        **Parametre:** `il` — il adı (örn: Samsun)

        **Doğrulandı:** Samsun için 17 ilçe (2026-02-28)
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - name: il
          in: query
          required: true
          description: İl adı
          schema:
            type: string
            examples:
              - "Samsun"
      responses:
        '200':
          description: İlçe listesi
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    ilce:
                      type: string
                      description: İlçe adı
                      examples:
                        - "Atakum"
                    il:
                      type: string
                      description: İl adı
                      examples:
                        - "Samsun"
                    merkezId:
                      type: integer
                      description: Merkez ID
                      examples:
                        - 95501
                    sondurumIstNo:
                      type: integer
                      description: Son durum istasyon numarası
                      examples:
                        - 17030
              examples:
                samsun-ilceleri:
                  summary: Samsun ilçeleri
                  externalValue: './examples/merkezler-ililcesi-response.json'

  /web/sondurumlar:
    get:
      operationId: getSonDurum
      tags: [Anlık Durum]
      summary: 🌡️ Anlık Hava Durumu (Son Durum)
      description: >
        Belirtilen merkeze ait en güncel ölçüm verilerini döner.

        **Parametre:** `/web/merkezler`'den dönen `merkezId` kullanılır
        (`sondurumIstNo` değil).

        **Doğrulandı:** merkezId=95501, Samsun/Atakum (2026-02-27)

        `hissedilenSicaklik` alanı şemada eksikti — gerçek yanıttan doğrulandı.
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/MerkezIdParam'
      responses:
        '200':
          description: Anlık hava durumu (tek elemanlı array)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SonDurum'
              examples:
                samsun-atakum:
                  summary: Samsun/Atakum (merkezId=95501)
                  externalValue: './examples/sondurumlar-response.json'

  /web/sondurumlar/ilmerkezleri:
    get:
      operationId: getIlMerkezleriSonDurum
      tags: [Anlık Durum]
      summary: 🇹🇷 Tüm İl Merkezleri Anlık Durum
      description: >
        Türkiye genelindeki tüm il merkezlerinin anlık hava durumunu döner.
        Harita uygulamaları için toplu veri kaynağıdır.

        **Doğrulandı:** 81 il merkezi (2026-02-27)
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
      responses:
        '200':
          description: Tüm il merkezleri anlık ölçümler
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SonDurum'
              examples:
                tum-il-merkezleri:
                  summary: Tüm 81 il merkezi anlık ölçümler
                  externalValue: './examples/sondurumlar-ilmerkezleri-response.json'

  /web/sondurumlar/kar:
    get:
      operationId: getKarKalinliklari
      tags: [Anlık Durum]
      summary: ❄️ Türkiye Geneli Kar Kalınlıkları
      description: >
        Türkiye genelindeki kayak merkezleri ve yüksek rakımlı istasyonların
        anlık kar kalınlığı (cm) verilerini döner.

        Belirli bir istasyonu bulmak için dönen dizide `istAd` alanına göre
        filtreleme yapılmalıdır.
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
      responses:
        '200':
          description: Kar kalınlıkları listesi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KarKalinligi'
              examples:
                kar-kalinliklari:
                  summary: Türkiye geneli kar kalınlıkları
                  externalValue: './examples/sondurumlar-kar-response.json'

  /web/tahminler/gunluk:
    get:
      operationId: getGunlukTahmin
      tags: [Tahminler]
      summary: 📅 5 Günlük Hava Tahmini
      description: >
        5 günlük (Gun1–Gun5) hava tahmini döner.
        **`gunlukTahminIstNo`** parametresi kullanılır.

        ⚠️ `Gun0` (bugün) alanları yanıtta **bulunmaz** — sunucu bugünü atlamaktadır.
        Yanıt `Gun1`–`Gun5` içerir.

        **Doğrulandı:** istno=95501, Samsun/Atakum (2026-02-27)
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/IstNoParam'
      responses:
        '200':
          description: 5 günlük tahmin
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GunlukTahmin'
              examples:
                samsun-atakum:
                  summary: Samsun/Atakum (istno=95501)
                  externalValue: './examples/tahminler-gunluk-response.json'

  /web/tahminler/saatlik:
    get:
      operationId: getSaatlikTahmin
      tags: [Tahminler]
      summary: ⏰ Saatlik Hava Tahmini
      description: >
        3 saatlik dilimler halinde saatlik tahmin döner.
        **`saatlikTahminIstNo`** parametresi kullanılır.

        Yanıt bir wrapper objesi içerir:
        `{ istNo, merkez, baslangicZamani, tahmin: [...] }`

        **Doğrulandı:** istno=17030, Samsun/Atakum — 11 zaman dilimi (2026-02-27)
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/IstNoParam'
      responses:
        '200':
          description: Saatlik tahmin (wrapper içinde)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SaatlikTahminWrapper'
              examples:
                samsun-atakum:
                  summary: Samsun/Atakum (istno=17030) — 11 zaman dilimi
                  externalValue: './examples/tahminler-saatlik-response.json'

  /web/ucdegerler:
    get:
      operationId: getUcDegerler
      tags: [Uç Değerler]
      summary: 📊 Tarihi Uç Değerler (Rekorlar)
      description: >
        Belirtilen merkez ve güne ait tarihi meteorolojik uç değerleri döner.
        (Rekor en yüksek, en düşük, ortalama sıcaklıklar)

        **Doğrulandı:** merkezId=95501, ay=2, gun=27 → max=24.5°C, min=-5.6°C (2026-02-27)
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/MerkezIdParam'
        - name: ay
          in: query
          required: true
          description: Ay numarası (1–12)
          schema:
            type: integer
            minimum: 1
            maximum: 12
            examples:
              - 2
        - name: gun
          in: query
          required: true
          description: Gün numarası (1–31)
          schema:
            type: integer
            minimum: 1
            maximum: 31
            examples:
              - 27
      responses:
        '200':
          description: Tarihi uç değerler
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UcDeger'
              examples:
                samsun-atakum:
                  summary: Samsun/Atakum - 27 Şubat 2026 tarihi uç değerler
                  externalValue: './examples/ucdegerler-response.json'

  /web/alarmlar:
    get:
      operationId: getAlarmlar
      tags: [Uyarılar]
      summary: 🔔 Aktif Meteoroloji Uyarıları
      description: >
        Aktif meteoroloji uyarılarını döner.
        **Doğrulandı:** 8 aktif uyarı (2026-02-27)
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
      responses:
        '200':
          description: Alarm/Uyarı listesi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Alarm'
              examples:
                aktif-uyarilar:
                  summary: 8 aktif meteoroloji uyarısı
                  externalValue: './examples/alarmlar-response.json'

  /web/meteoalarm/today:
    get:
      operationId: getMeteoAlarmToday
      tags: [Uyarılar]
      summary: ⚠️ Bugünkü MeteoAlarmlar (Avrupa Formatı)
      description: >
        Avrupa MeteoAlarm sistemi formatında günlük uyarıları döner.
        Uyarılar sarı/turuncu/kırmızı seviyelere göre ayrılmıştır.

        **Doğrulandı:** 10 aktif MeteoAlarm (2026-02-27)
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
      responses:
        '200':
          description: Günlük MeteoAlarmlar
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeteoAlarm'
              examples:
                bugunku-uyarilar:
                  summary: 10 aktif MeteoAlarm uyarısı (Avrupa formatı)
                  externalValue: './examples/meteoalarm-today-response.json'

  /FTPDATA/uzal/radar/{gizli_kod}/{gizli_kod}{radar_tipi}{periyot}.jpg:
    get:
      operationId: getCanliRadar
      servers:
        - url: https://www.mgm.gov.tr
          name: mgm-www
          description: "⚠️ Radar için servis.mgm.gov.tr değil, www.mgm.gov.tr kullanılmalıdır"
      tags: [Radar]
      summary: 📡 Canlı Radar Görüntüleri
      description: >
        MGM web sunucusundan radar JPEG görüntüsü döner.
        Harita uygulamalarında overlay olarak kullanılabilir.

        **⚠️ Doğru sunucu: `https://www.mgm.gov.tr`**
        `servis.mgm.gov.tr` üzerinden HTTP 403 döner — bu endpoint yalnızca
        `www.mgm.gov.tr` üzerinden erişilebilir (test edildi, 2026-02-27).

        **📝 Not:** Radar görüntüleri herkese açık olarak sunulur —
        `Origin` header'ı gerekli değildir.

        **Radar istasyon kodları (gizli_kod):**

        | Kod    | Şehir/Bölge    |
        |--------|----------------|
        | `smn`  | Samsun         |
        | `ist`  | İstanbul       |
        | `afy`  | Afyon          |
        | `comp` | Türkiye Geneli |

        **`radar_tipi`:**
        - `max` → En net kütleler (önerilen)
        - `ppi` → Hücre tabanlı
        - `vil` → Dikey entegre sıvı suya göre ⚠️ `comp` koduyla çalışmaz (HTTP 302)

        **`periyot`:**
        - `15` veya `00` → Güncel tekil görüntü
        - `1`, `2`, `3`, … → Animasyon kareleri (geçmişe dönük)
      parameters:
        - name: gizli_kod
          in: path
          required: true
          description: Radar istasyonu 3 harfli kodu
          schema:
            type: string
            examples:
              - "smn"
        - name: radar_tipi
          in: path
          required: true
          schema:
            type: string
            enum: [max, ppi, vil]
            examples:
              - "max"
        - name: periyot
          in: path
          required: true
          schema:
            type: string
            examples:
              - "15"
      responses:
        '200':
          description: Radar görüntüsü (JPEG)
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '403':
          description: Erişim reddedildi — tarayıcı session/cookie gerekebilir
        '404':
          description: Görüntü bulunamadı (radar bakımda veya parametreler hatalı)

  /FTPDATA/sht/wrf/{il}_{ilce}.png:
    get:
      operationId: getWRFMeteogram
      servers:
        - url: https://www.mgm.gov.tr
          description: MGM ana web sunucusu
      tags: [Tahmin Görsel]
      summary: 📈 WRF Meteogram Görüntüsü
      description: >
        WRF (Weather Research and Forecasting) modeline ait meteogram görüntüsü.
        İl ve ilçe bazında hava durumu tahmin grafikleri sunar.

        **📝 Önemli Bilgiler:**
        - **Güncelleme:** Her gün 01:00 ve 13:00 TSİ'de (2 defa)
        - **Zaman Dilimi:** UTC (GMT) formatında hazırlanır
        - **Format:** PNG görüntü
        - **Naming:** `{il}_{ilce}.png` formatında (örn: `Samsun_Atakum.png`)

        **🌐 Sunucu:** `www.mgm.gov.tr` — `Origin` header gerekmez
      parameters:
        - name: il
          in: path
          required: true
          description: İl adı (büyük harfle başlayan, boşluksuz)
          schema:
            type: string
            examples:
              - "Samsun"
              - "Istanbul"
              - "Ankara"
        - name: ilce
          in: path
          required: true
          description: İlçe adı (büyük harfle başlayan, boşluksuz)
          schema:
            type: string
            examples:
              - "Atakum"
              - "Kadikoy"
              - "Cankaya"
      responses:
        '200':
          description: WRF Meteogram görüntüsü (PNG)
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: Görüntü bulunamadı (il/ilçe kombinasyonu hatalı veya görüntü henüz oluşturulmadı)

  /FTPDATA/sht/harita/{t}_{s}.png:
    get:
      operationId: getWRFHarita
      servers:
        - url: https://www.mgm.gov.tr
          description: MGM ana web sunucusu
      tags: [Tahmin Görsel]
      summary: 🗺️ WRF Model Haritası
      description: >
        WRF (Weather Research and Forecasting) modeline ait çeşitli meteorolojik
        harita görüntüleri. 3 saatlik aralıklarla 72 saate kadar tahmin sunar.

        **📝 Önemli Bilgiler:**
        - **Güncelleme:** Her gün 01:00 ve 13:00 TSİ'de (2 defa)
        - **Zaman Dilimi:** UTC (GMT) formatında — TSİ'den 3 saat geridedir
        - **Format:** PNG görüntü
        - **Öngörü:** 0-72 saat (3 saatlik adımlarla)

        **🌐 Sunucu:** `www.mgm.gov.tr` — `Origin` header gerekmez
      parameters:
        - name: t
          in: path
          required: true
          description: Harita tipi
          schema:
            type: string
            enum: [SFC, "850", "700", "500", "300", rain, rainG]
            examples:
              - "SFC"
        - name: s
          in: path
          required: true
          description: Tahmin saati (UTC/GMT, 3 saatlik aralıklar)
          schema:
            type: string
            enum: ["00", "03", "06", "09", "12", "15", "18", "21", "24", "27", "30", "33", "36", "39", "42", "45", "48", "51", "54", "57", "60", "63", "66", "69", "72"]
            examples:
              - "03"
      responses:
        '200':
          description: WRF Model haritası (PNG)
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: Görüntü bulunamadı (parametreler hatalı veya görüntü henüz oluşturulmadı)

  /FTPDATA/analiz/sonSOA.xml:
    get:
      operationId: getSonSOA
      servers:
        - url: https://www.mgm.gov.tr
          description: MGM ana web sunucusu
      tags: [Analiz]
      summary: 📊 Son SOA (Sıcaklık ve Yağış) Analiz Verisi
      description: >
        Son Sıcaklık ve Yağış analiz verilerini XML formatında döner.
